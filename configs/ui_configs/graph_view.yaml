# The graph view on a node's page: how it groups edge types into categories,
# which edge types it hides until they are asked for, and how many stems it
# draws around a node before gathering them into their categories.
#
# The UI reads this file when it is built (webapp/grebi_ui/build.mjs), so a
# change here reaches the site with the next frontend build.
#
# Edge types are matched by their full name, such as biolink:subclass_of,
# against the patterns below. * stands for any run of characters, and case is
# ignored. An edge type belongs to the first category with a pattern that
# matches it, so the order of the categories matters; one that no category
# matches goes in "Other".

# A node with more stems than this (incoming and outgoing together) has each
# category's stems gathered into one bubble, which opens when clicked. An open
# category draws at most this many of its stems, largest first, and gathers
# the rest into a "+N more" bubble.
max_stems: 12

# Always drawn as stems of their own, never gathered into a category. Both are
# kept: biolink:subclass_of and ols:hierarchicalParent are not always the same.
pinned_edge_types:
  - biolink:subclass_of
  - ols:hierarchicalParent

# Hidden until shown from the filters beside the graph, whatever their category.
hidden_edge_types:
  - ols:hierarchicalAncestor   # every ancestor; the parents are shown

categories:

  - id: hierarchy
    label: Hierarchy
    edge_types:
      - biolink:subclass_of
      - ols:hierarchicalParent
      - ols:hierarchicalAncestor
      - "*:is_a"
      - "*subclass*"
      - "*superclass*"
      - "*broader*"
      - "*narrower*"
      - reactome:instanceOf
      - reactome:superTaxon

  - id: mappings
    label: Mappings
    edge_types:
      - "*match"               # broad_match, close_match, relatedMatch, crossSpeciesNarrowMatch, ...
      - "*mappedTo"
      - skos:mappingRelation
      - "*xref"
      - "*cross_reference"
      - "*crossReference"
      - "*equivalentTo"
      - "*sameAs"

