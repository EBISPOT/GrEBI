id: Robokop.BINDING
enabled: true
description: "Curated data on chemical entities and their molecular targets from the Binding DataBase (BindingDB)"
download:
  - dest: robokop/binding_edges.jsonl.gz
    sources:
      - https://stars.renci.org/var/plater/bl-4.2.1/BINDING_Automat/9164067231dc9b8c/edges.jsonl.gz
  - dest: robokop/binding_nodes.jsonl.gz
    sources:
      - https://stars.renci.org/var/plater/bl-4.2.1/BINDING_Automat/9164067231dc9b8c/nodes.jsonl.gz
ingests:
  - globs: ["robokop/binding_edges.jsonl.gz"]
    command: '
      zcat $GREBI_INGEST_FILENAME |
      grebi_ingest_kgx_edges
          --kgx-inject-key-prefix robokop:'
  - globs: ["robokop/binding_nodes.jsonl.gz"]
    command: '
      zcat $GREBI_INGEST_FILENAME |
      grebi_transform_jsonl
          --json-rename category:grebi:type
          --json-inject-key-prefix robokop:'
