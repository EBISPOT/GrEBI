name: Robokop.IntAct
enabled: true
download:
  - dest: robokop/intact_edges.jsonl.gz
    sources:
      - https://stars.renci.org/var/plater/bl-4.2.1/IntAct_Automat/e5b936f966a02c2c/edges.jsonl.gz
  - dest: robokop/intact_nodes.jsonl.gz
    sources:
      - https://stars.renci.org/var/plater/bl-4.2.1/IntAct_Automat/e5b936f966a02c2c/nodes.jsonl.gz
ingests:
  - globs: ["robokop/intact_edges.jsonl.gz"]
    command: '
      zcat $GREBI_INGEST_FILENAME |
      grebi_ingest_kgx_edges
          --kgx-inject-key-prefix robokop:'
  - globs: ["robokop/intact_nodes.jsonl.gz"]
    command: '
      zcat $GREBI_INGEST_FILENAME |
      grebi_transform_jsonl
          --json-rename category:grebi:type
          --json-inject-key-prefix robokop:'