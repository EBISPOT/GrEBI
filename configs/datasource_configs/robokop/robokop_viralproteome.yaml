id: Robokop.ViralProteome
enabled: true
description: "Curated GO term assignments to proteins and proteome relationships derived from UniProt for all NCBI taxa classified as viruses, from the GO Consortium's Viral Proteome resource"
download:
  - dest: robokop/viralproteome_edges.jsonl.gz
    sources:
      - https://stars.renci.org/var/plater/bl-4.2.1/ViralProteome_Automat/8ca116ae0bba6945/edges.jsonl.gz
  - dest: robokop/viralproteome_nodes.jsonl.gz
    sources:
      - https://stars.renci.org/var/plater/bl-4.2.1/ViralProteome_Automat/8ca116ae0bba6945/nodes.jsonl.gz
ingests:
  - globs: ["robokop/viralproteome_edges.jsonl.gz"]
    command: '
      zcat $GREBI_INGEST_FILENAME |
      grebi_ingest_kgx_edges
          --kgx-inject-key-prefix robokop:'
  - globs: ["robokop/viralproteome_nodes.jsonl.gz"]
    command: '
      zcat $GREBI_INGEST_FILENAME |
      grebi_transform_jsonl
          --json-rename category:grebi:type
          --json-inject-key-prefix robokop:'