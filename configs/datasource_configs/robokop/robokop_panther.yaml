id: Robokop.PANTHER
enabled: true
description: "Gene family phylogenetic trees with annotations for family, protein class, subfamily, orthologs, paralogs, GO function, and Reactome pathways, from the PANTHER classification system"
download:
  - dest: robokop/panther_edges.jsonl.gz
    sources:
      - https://stars.renci.org/var/plater/bl-4.2.1/PANTHER_Automat/c0189f14ba41da6c/edges.jsonl.gz
  - dest: robokop/panther_nodes.jsonl.gz
    sources:
      - https://stars.renci.org/var/plater/bl-4.2.1/PANTHER_Automat/c0189f14ba41da6c/nodes.jsonl.gz
ingests:
  - globs: ["robokop/panther_edges.jsonl.gz"]
    command: '
      zcat $GREBI_INGEST_FILENAME |
      grebi_ingest_kgx_edges
          --kgx-inject-key-prefix robokop:'
  - globs: ["robokop/panther_nodes.jsonl.gz"]
    command: '
      zcat $GREBI_INGEST_FILENAME |
      grebi_transform_jsonl
          --json-rename category:grebi:type
          --json-inject-key-prefix robokop:'