id: Robokop.Pharos
enabled: true
description: "Comprehensive knowledge-base for the Druggable Genome focusing on G-protein-coupled receptors, ion channels, and kinases, from the Pharos/IDG Knowledge Management Center"
download:
  - dest: robokop/pharos_edges.jsonl.gz
    sources:
      - https://stars.renci.org/var/plater/bl-4.2.1/PHAROS_Automat/d3068b509bf17ff3/edges.jsonl.gz
  - dest: robokop/pharos_nodes.jsonl.gz
    sources:
      - https://stars.renci.org/var/plater/bl-4.2.1/PHAROS_Automat/d3068b509bf17ff3/nodes.jsonl.gz
ingests:
  - globs: ["robokop/pharos_edges.jsonl.gz"]
    command: '
      zcat $GREBI_INGEST_FILENAME |
      grebi_ingest_kgx_edges
          --kgx-inject-key-prefix robokop:'
  - globs: ["robokop/pharos_nodes.jsonl.gz"]
    command: '
      zcat $GREBI_INGEST_FILENAME |
      grebi_transform_jsonl
          --json-rename category:grebi:type
          --json-inject-key-prefix robokop:'