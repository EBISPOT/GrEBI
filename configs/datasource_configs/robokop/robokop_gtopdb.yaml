id: Robokop.GtoPdb
enabled: true
description: "Quantitative information on drug targets and the prescription medicines and experimental drugs that act on them, from the IUPHAR/BPS Guide to Pharmacology database"
download:
  - dest: robokop/gtopdb_edges.jsonl.gz
    sources:
      - https://stars.renci.org/var/plater/bl-4.2.1/GtoPdb_Automat/0ea6074c824c2236/edges.jsonl.gz
  - dest: robokop/gtopdb_nodes.jsonl.gz
    sources:
      - https://stars.renci.org/var/plater/bl-4.2.1/GtoPdb_Automat/0ea6074c824c2236/nodes.jsonl.gz
ingests:
  - globs: ["robokop/gtopdb_edges.jsonl.gz"]
    command: '
      zcat $GREBI_INGEST_FILENAME |
      grebi_ingest_kgx_edges
          --kgx-inject-key-prefix robokop:'
  - globs: ["robokop/gtopdb_nodes.jsonl.gz"]
    command: '
      zcat $GREBI_INGEST_FILENAME |
      grebi_transform_jsonl
          --json-rename category:grebi:type
          --json-inject-key-prefix robokop:'