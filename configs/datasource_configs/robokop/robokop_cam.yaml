id: Robokop.CAM
enabled: true
description: "Causal Activity Models (CAMs) — small OWL knowledge graphs modelling interactions between biological concept instances as interlinked representations of complex biological or environmental processes"
download:
  - dest: robokop/cam_edges.jsonl.gz
    sources:
      - https://stars.renci.org/var/plater/bl-4.2.1/CAMKP_Automat/e92bd7b217535f2d/edges.jsonl.gz
  - dest: robokop/cam_nodes.jsonl.gz
    sources:
      - https://stars.renci.org/var/plater/bl-4.2.1/CAMKP_Automat/e92bd7b217535f2d/nodes.jsonl.gz
ingests:
  - globs: ["robokop/cam_edges.jsonl.gz"]
    command: '
      zcat $GREBI_INGEST_FILENAME |
      grebi_ingest_kgx_edges
          --kgx-inject-key-prefix robokop:'
  - globs: ["robokop/cam_nodes.jsonl.gz"]
    command: '
      zcat $GREBI_INGEST_FILENAME |
      grebi_transform_jsonl
          --json-rename category:grebi:type
          --json-inject-key-prefix robokop:'