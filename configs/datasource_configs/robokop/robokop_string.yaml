id: Robokop.STRING
enabled: true
description: "Known and predicted protein-protein interactions derived from genomic context predictions, high-throughput experiments, conserved co-expression, automated text mining, and primary data sources, from STRING"
download:
  - dest: robokop/string_edges.jsonl.gz
    sources:
      - https://stars.renci.org/var/plater/bl-4.2.1/STRING-DB_Automat/4ca5a0ce557e2c18/edges.jsonl.gz
  - dest: robokop/string_nodes.jsonl.gz
    sources:
      - https://stars.renci.org/var/plater/bl-4.2.1/STRING-DB_Automat/4ca5a0ce557e2c18/nodes.jsonl.gz
ingests:
  - globs: ["robokop/string_edges.jsonl.gz"]
    command: '
      zcat $GREBI_INGEST_FILENAME |
      grebi_ingest_kgx_edges
          --kgx-inject-key-prefix robokop:'
  - globs: ["robokop/string_nodes.jsonl.gz"]
    command: '
      zcat $GREBI_INGEST_FILENAME |
      grebi_transform_jsonl
          --json-rename category:grebi:type
          --json-inject-key-prefix robokop:'