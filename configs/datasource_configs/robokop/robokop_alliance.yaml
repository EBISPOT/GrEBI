name: Robokop.Alliance
enabled: true
download:
  - dest: robokop/alliance_edges.jsonl.gz
    sources:
      - https://stars.renci.org/var/plater/bl-4.2.1/GenomeAllianceOrthologs_Automat/06e2a3c1eeea5251/edges.jsonl.gz
  - dest: robokop/alliance_nodes.jsonl.gz
    sources:
      - https://stars.renci.org/var/plater/bl-4.2.1/GenomeAllianceOrthologs_Automat/06e2a3c1eeea5251/nodes.jsonl.gz
ingests:
  - globs: ["robokop/alliance_edges.jsonl.gz"]
    command: '
      zcat $GREBI_INGEST_FILENAME |
      grebi_ingest_kgx_edges
          --kgx-inject-key-prefix robokop:'
  - globs: ["robokop/alliance_nodes.jsonl.gz"]
    command: '
      zcat $GREBI_INGEST_FILENAME |
      grebi_transform_jsonl
          --json-rename category:grebi:type
          --json-inject-key-prefix robokop:'
