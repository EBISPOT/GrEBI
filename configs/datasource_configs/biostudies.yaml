id: BioStudies
enabled: true
description: "EMBL-EBI BioStudies study and collection metadata, excluding Europe PMC and linked submission files"
download:
  # A snapshot of every non-Europe-PMC study's PageTab JSON, one per line, made
  # with dataload/00_download/biostudies_snapshot.py and published on the SPOT
  # FTP area (as MGnify is). The BioStudies FTP tree is not NFS-mounted on the
  # HPC and has no per-study index, and fetching ~100k studies from the API on
  # every dataload is not on, so the pipeline never talks to BioStudies itself.
  - dest: biostudies/biostudies.jsonl.gz
    sources:
      - https://ftp.ebi.ac.uk/pub/databases/spot/kg/data/biostudies.jsonl.gz
ingests:
  - globs: ["biostudies/biostudies.jsonl.gz"]
    memory: "4 GB"
    command: 'zcat $GREBI_INGEST_FILENAME | grebi_ingest_biostudies'
