id: OpenTargets
enabled: true
description: "Target-disease evidence records from the Open Targets evidence pipeline"
download:
  - dest: otar/evidence/
    sources:
      - /nfs/production/parkinso/spot/jmcl/otar/output/evidence_*/*.parquet
ingests:
  # The download stage links every source file flat into otar/evidence/, so
  # the glob is one level deep (a */*.parquet here matched nothing and the
  # evidence silently never ingested).
  - globs: ["otar/evidence/*.parquet"]
    command: '
      cat $GREBI_INGEST_FILENAME |
      grebi_parquet2jsonl |
      grebi_transform_jsonl
          --json-inject-type otar:Evidence
          --json-inject-key-prefix otar:
          --json-inject-value-prefix literature:pmid:
          --json-inject-value-prefix targetId:ensembl:
          --json-de-nest-field diseaseModelAssociatedHumanPhenotypes.id
          --json-de-nest-field diseaseModelAssociatedModelPhenotypes.id
          '
