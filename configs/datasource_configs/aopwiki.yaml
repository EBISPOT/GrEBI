id: AOPWiki
enabled: true
description: "A knowledge base of adverse outcome pathways linking molecular initiating events to adverse outcomes via key events"
download:
  - dest: aopwiki/AOPWikiRDF.ttl
    sources:
      - https://raw.githubusercontent.com/marvinm2/AOPWikiRDF/master/data/AOPWikiRDF.ttl
  - dest: aopwiki/AOPWikiRDF-Genes.ttl
    sources:
      - https://raw.githubusercontent.com/marvinm2/AOPWikiRDF/master/data/AOPWikiRDF-Genes.ttl
ingests:
  - globs: ["aopwiki/*.ttl"]
    command: '
      cat $GREBI_INGEST_FILENAME |
      grebi_rdf2jsonl
          --rdf-type rdf_triples_turtle
          --rdf-types-are-grebi-types'
