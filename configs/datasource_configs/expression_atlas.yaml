# Generated download manifest; edit the threshold in command below.
# Refresh with generate_expression_atlas.py and the FTP experiments.json catalogue.
# 256 bulk baseline RNA-seq studies; no raw or single-cell files.
id: ExpressionAtlas
enabled: true
description: "Baseline gene expression in mapped anatomical locations across species"
ingests:
  - globs: ["expression_atlas/experiments/*/*-tpms.tsv"]
    memory: "4 GB"
    command: >-
      python3 "$GREBI_DATALOAD_HOME/01_ingest/expression_atlas.py"
      --min-median-tpm 0.5
      -- "$GREBI_INGEST_FILENAME"
download:
  - dest: expression_atlas/experiments/E-CURD-1/E-CURD-1-tpms.tsv
    sources:
      - /nfs/ftp/public/databases/microarray/data/atlas/experiments/E-CURD-1/E-CURD-1-tpms.tsv
      - https://ftp.ebi.ac.uk/pub/databases/microarray/data/atlas/experiments/E-CURD-1/E-CURD-1-tpms.tsv
