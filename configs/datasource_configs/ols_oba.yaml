name: OLS.oba
enabled: true
download:
  - dest: ols/oba.json.gz
    sources:
      - https://ftp.ebi.ac.uk/pub/databases/spot/ols/dev/latest/ontology_jsons/oba.json.gz
ingests:
  - globs: ["ols/oba.json.gz"]
    command: '
      zcat $GREBI_INGEST_FILENAME |
      grebi_ingest_ols
        --ontologies oba
        --skip-obsolete'