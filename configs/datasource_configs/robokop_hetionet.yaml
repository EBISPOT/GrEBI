name: Robokop.Hetionet
enabled: true
download:
  - dest: robokop/hetionet_edges.jsonl.gz
    sources:
      - https://stars.renci.org/var/plater/bl-4.2.1/Hetio_Automat/85a5f53e63150e1e/edges.jsonl.gz
  - dest: robokop/hetionet_nodes.jsonl.gz
    sources:
      - https://stars.renci.org/var/plater/bl-4.2.1/Hetio_Automat/85a5f53e63150e1e/nodes.jsonl.gz
ingests:
  - globs: ["robokop/hetionet_edges.jsonl.gz"]
    command: '
      zcat $GREBI_INGEST_FILENAME |
      grebi_ingest_kgx_edges
          --kgx-inject-key-prefix robokop:'
  - globs: ["robokop/hetionet_nodes.jsonl.gz"]
    command: '
      zcat $GREBI_INGEST_FILENAME |
      grebi_transform_jsonl
          --json-rename category:grebi:type
          --json-inject-key-prefix robokop:'