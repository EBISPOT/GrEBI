name: Robokop.HMDB
enabled: true
download:
  - dest: robokop/hmdb_edges.jsonl.gz
    sources:
      - https://stars.renci.org/var/plater/bl-4.2.1/HMDB_Automat/6715124699b6dbf0/edges.jsonl.gz
  - dest: robokop/hmdb_nodes.jsonl.gz
    sources:
      - https://stars.renci.org/var/plater/bl-4.2.1/HMDB_Automat/6715124699b6dbf0/nodes.jsonl.gz
ingests:
  - globs: ["robokop/hmdb_edges.jsonl.gz"]
    command: '
      zcat $GREBI_INGEST_FILENAME |
      grebi_ingest_kgx_edges
          --kgx-inject-key-prefix robokop:'
  - globs: ["robokop/hmdb_nodes.jsonl.gz"]
    command: '
      zcat $GREBI_INGEST_FILENAME |
      grebi_transform_jsonl
          --json-rename category:grebi:type
          --json-inject-key-prefix robokop:'