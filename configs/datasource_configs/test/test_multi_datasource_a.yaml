id: TestMultiDatasourceA
enabled: true
description: "Test datasource A for multi-datasource merge testing"
download:
  - dest: test_multi_datasource/source_a_edges.jsonl
    sources:
      - tests/data/test_multi_datasource/source_a_edges.jsonl
  - dest: test_multi_datasource/source_a_nodes.jsonl
    sources:
      - tests/data/test_multi_datasource/source_a_nodes.jsonl
ingests:
  - globs: ["test_multi_datasource/source_a_edges.jsonl"]
    command: '
      cat $GREBI_INGEST_FILENAME |
      grebi_ingest_kgx_edges
          --kgx-inject-key-prefix test_mda:'
  - globs: ["test_multi_datasource/source_a_nodes.jsonl"]
    command: '
      cat $GREBI_INGEST_FILENAME |
      grebi_transform_jsonl
          --json-rename category:grebi:type
          --json-inject-key-prefix test_mda:'
