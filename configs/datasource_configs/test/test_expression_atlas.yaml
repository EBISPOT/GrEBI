id: ExpressionAtlas
enabled: true
description: "Test: real human/soybean expression summaries and synthetic filtering boundaries"
download:
  - dest: expression_atlas/experiments/E-MTAB-513/
    sources:
      - tests/data/test_expression_atlas/E-MTAB-513/*
  - dest: expression_atlas/experiments/E-MTAB-4045/
    sources:
      - tests/data/test_expression_atlas/E-MTAB-4045/*
  - dest: expression_atlas/experiments/E-TEST-1/
    sources:
      - tests/data/test_expression_atlas/E-TEST-1/*
ingests:
  - globs: ["expression_atlas/experiments/*/*-tpms.tsv"]
    command: >-
      python3 "$GREBI_DATALOAD_HOME/01_ingest/expression_atlas.py"
      --min-median-tpm 0.5
      -- "$GREBI_INGEST_FILENAME"
