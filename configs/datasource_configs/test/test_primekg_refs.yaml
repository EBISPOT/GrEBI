id: OntologyTerms
enabled: true
description: "Test datasource: minimal stand-ins for the MONDO, HPO, GO and UBERON terms the test_primekg rows reference, so each PrimeKG node must land on the same graph node as the ontology term (in production these come from the OLS datasources)"
download:
  - dest: test_primekg/reference_terms.jsonl
    sources:
      - tests/data/test_primekg/reference_terms.jsonl
ingests:
  - globs: ["test_primekg/reference_terms.jsonl"]
    command: '
      cat $GREBI_INGEST_FILENAME |
      grebi_transform_jsonl
          --json-rename category:grebi:type
          --json-inject-key-prefix ols:'
