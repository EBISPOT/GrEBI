id: BioStudies
enabled: true
description: "Test datasource: BioStudies PageTab metadata without linked submission files"
download:
  # Uncompressed so the fixture is diffable; the real snapshot is gzipped.
  - dest: test_biostudies/biostudies.jsonl
    sources:
      - tests/data/test_biostudies/biostudies.jsonl
ingests:
  - globs: ["test_biostudies/biostudies.jsonl"]
    command: 'cat $GREBI_INGEST_FILENAME | grebi_ingest_biostudies'
