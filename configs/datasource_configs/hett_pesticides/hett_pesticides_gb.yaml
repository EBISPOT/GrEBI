id: HETT_Pesticides.GB
enabled: true
description: "Great Britain Health and Safety Executive approved active substances register"
download:
  - dest: hett_pesticides/active-substance-register.xlsx
    sources:
      - https://ftp.ebi.ac.uk/pub/databases/spot/kg/data/active-substance-register.xlsx
ingests:
  - globs: ["hett_pesticides/active-substance-register.xlsx"]
    command: '
      cat $GREBI_INGEST_FILENAME |
      $GREBI_DATALOAD_HOME/01_ingest/hett_pesticides_gb.py --datasource-name $GREBI_INGEST_DATASOURCE_NAME'
