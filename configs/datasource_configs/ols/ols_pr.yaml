name: OLS.pr
enabled: true
download:
  - dest: ols/pr.json.gz
    sources:
      - /nfs/production/parkinso/spot/ols4/dev2/out/ontology_jsons/pr.json.gz
      - https://ftp.ebi.ac.uk/pub/databases/spot/ols/dev/latest/ontology_jsons/pr.json.gz
ingests:
  - globs: ["ols/pr.json.gz"]
    command: '
      zcat $GREBI_INGEST_FILENAME |
      grebi_ingest_ols
        --ontologies pr
        --skip-obsolete'