id: OLS.chebi
enabled: true
download:
  - dest: ols_embeddings/text-embedding-3-small_pca512/chebi.parquet
    sources:
      - /nfs/production/parkinso/spot/ols4/dev2/out/embeddings/text-embedding-3-small_pca512/chebi.parquet
      - https://ftp.ebi.ac.uk/pub/databases/spot/ols/dev2/embeddings/text-embedding-3-small_pca512/chebi.parquet
ingests:
  - globs: ["ols_embeddings/text-embedding-3-small_pca512/chebi.parquet"]
    command: '
      cat $GREBI_INGEST_FILENAME |
      grebi_parquet2jsonl |
      grebi_transform_jsonl
        --json-select-by-value string_type:LABEL
        --json-select-keys iri,embedding
        --json-rename iri:id
        --json-rename embedding:embedding:text-embedding-3-small_pca512
          '
