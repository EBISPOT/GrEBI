id: OLS.mp
enabled: true
description: "Standardised vocabulary of phenotypic abnormalities in mammalian organisms"
download:
  - dest: ols/mp.json.gz
    sources:
      - /nfs/production/parkinso/spot/ols4/dev2/out/ontology_jsons/mp.json.gz
      - https://ftp.ebi.ac.uk/pub/databases/spot/ols/dev/latest/ontology_jsons/mp.json.gz
ingests:
  - globs: ["ols/mp.json.gz"]
    command: '
      zcat $GREBI_INGEST_FILENAME |
      grebi_ingest_ols
        --ontologies mp
        --skip-obsolete'