id: OLS.bfo
enabled: true
description: "A top-level ontology providing a framework for domain ontologies"
download:
  - dest: ols/bfo.json.gz
    sources:
      - /nfs/production/parkinso/spot/ols4/dev2/out/ontology_jsons/bfo.json.gz
      - https://ftp.ebi.ac.uk/pub/databases/spot/ols/dev/latest/ontology_jsons/bfo.json.gz
ingests:
  - globs: ["ols/bfo.json.gz"]
    command: '
      zcat $GREBI_INGEST_FILENAME |
      grebi_ingest_ols
        --ontologies bfo
        --skip-obsolete'