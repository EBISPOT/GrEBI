name: OLS.cl
enabled: true
download:
  - dest: ols/cl.json.gz
    sources:
      - https://ftp.ebi.ac.uk/pub/databases/spot/ols/dev/latest/ontology_jsons/cl.json.gz
ingests:
  - globs: ["ols/cl.json.gz"]
    command: '
      zcat $GREBI_INGEST_FILENAME |
      grebi_ingest_ols
        --ontologies cl
        --skip-obsolete'