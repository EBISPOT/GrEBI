name: Robokop.GTEx
enabled: true
download:
  - dest: robokop/gtex_edges.jsonl.gz
    sources:
      - https://stars.renci.org/var/plater/bl-4.2.1/GTEx_Automat/a6448b9092bb81a1/edges.jsonl.gz
  - dest: robokop/gtex_nodes.jsonl.gz
    sources:
      - https://stars.renci.org/var/plater/bl-4.2.1/GTEx_Automat/a6448b9092bb81a1/nodes.jsonl.gz
ingests:
  - globs: ["robokop/gtex_edges.jsonl.gz"]
    command: '
      zcat $GREBI_INGEST_FILENAME |
      grebi_ingest_kgx_edges
          --kgx-inject-key-prefix robokop:'
  - globs: ["robokop/gtex_nodes.jsonl.gz"]
    command: '
      zcat $GREBI_INGEST_FILENAME |
      grebi_transform_jsonl
          --json-rename category:grebi:type
          --json-inject-key-prefix robokop:'
