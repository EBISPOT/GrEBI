name: Robokop.PANTHER
enabled: true
ingests:
  - globs: ["dataload/00_fetch_data/robokop/panther_edges.jsonl.gz"]
    command: '
      grebi_ingest_kgx_edges
          --kgx-inject-key-prefix robokop:'
  - globs: ["dataload/00_fetch_data/robokop/panther_nodes.jsonl.gz"]
    command: '
      grebi_transform_jsonl
          --json-rename category:grebi:type
          --json-inject-key-prefix robokop:'