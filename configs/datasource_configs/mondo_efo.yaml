id: EFO.mappings
enabled: true
description: "Curated mappings between the Mondo Disease Ontology and the Experimental Factor Ontology (EFO)"
download:
  - dest: mondo_efo/mondo_efo_mappings.tsv
    sources:
      - https://raw.githubusercontent.com/EBISPOT/efo/master/src/ontology/components/mondo_efo_mappings.tsv
ingests:
  - globs: ["mondo_efo/mondo_efo_mappings.tsv"]
    command: '
      cat $GREBI_INGEST_FILENAME |
      $GREBI_DATALOAD_HOME/01_ingest/mondo_efo_mappings.py --datasource-name $GREBI_INGEST_DATASOURCE_NAME'
