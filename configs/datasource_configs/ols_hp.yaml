name: OLS.hp
enabled: true
download:
  - dest: ols/hp.json.gz
    sources:
      - https://ftp.ebi.ac.uk/pub/databases/spot/ols/dev/latest/ontology_jsons/hp.json.gz
ingests:
  - globs: ["ols/hp.json.gz"]
    command: '
      zcat $GREBI_INGEST_FILENAME |
      grebi_ingest_ols
        --ontologies hp
        --skip-obsolete'