id: Biomappings
enabled: true
description: "Community-curated cross-reference mappings between biomedical entities from the Biopragmatics project"
download:
  - dest: biomappings/mappings.tsv
    sources:
      - https://raw.githubusercontent.com/biopragmatics/biomappings/refs/heads/master/src/biomappings/resources/mappings.tsv
ingests:
  - globs: ["biomappings/mappings.tsv"]
    command: '
      grebi_ingest_biomappings |
      grebi_transform_jsonl --json-inject-key-prefix biomappings:'
