id: HGNC
enabled: true
description: "The authoritative resource for approved human gene symbols and names"
download:
  - dest: hgnc/hgnc_complete_set.json
    sources:
      - https://storage.googleapis.com/public-download-files/hgnc/json/json/hgnc_complete_set.json
ingests:
  - globs: ["hgnc/hgnc_complete_set.json"]
    command: '
      jq -c .response.docs[] $GREBI_INGEST_FILENAME |
      grebi_transform_jsonl
          --json-rename hgnc_id:id
          --json-inject-type hgnc:Gene
          --json-inject-key-prefix hgnc:
          --json-inject-value-prefix uniprot_ids:uniprot:
          --json-inject-value-prefix omim_id:omim:
          --json-inject-value-prefix ena:ena:
          --json-inject-value-prefix vega_id:vega:
          --json-inject-value-prefix ccds_id:ccds:
          --json-inject-value-prefix entrez_id:entrez:
          --json-inject-value-prefix pubmed_id:pmid:'
