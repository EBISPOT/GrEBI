name: MONARCH
enabled: true
ingests:
  - globs: ["dataload/00_fetch_data/monarch/monarch-kg_edges.jsonl.gz"]
    command: '
      grebi_ingest_kgx_edges
          --kgx-inject-key-prefix monarch:'
  - globs: ["dataload/00_fetch_data/monarch/monarch-kg_nodes.jsonl.gz"]
    command: '
      grebi_transform_jsonl
          --json-rename category:grebi:type
          --json-inject-key-prefix monarch:'
