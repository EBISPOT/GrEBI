name: MONARCH
enabled: true
download:
  - dest: monarch/
    sources:
      - https://data.monarchinitiative.org/monarch-kg/latest/monarch-kg.jsonl.tar.gz
ingests:
  - globs: ["monarch/monarch-kg_edges.jsonl"]
    command: '
      cat $GREBI_INGEST_FILENAME |
      grebi_ingest_kgx_edges
          --kgx-inject-key-prefix monarch:'
  - globs: ["monarch/monarch-kg_nodes.jsonl"]
    command: '
      cat $GREBI_INGEST_FILENAME |
      grebi_transform_jsonl
          --json-rename category:grebi:type
          --json-inject-key-prefix monarch:'
