name: OLS.cheminf
enabled: true
download:
  - dest: ols/cheminf.json.gz
    sources:
      - https://ftp.ebi.ac.uk/pub/databases/spot/ols/dev/latest/ontology_jsons/cheminf.json.gz
ingests:
  - globs: ["ols/cheminf.json.gz"]
    command: '
      zcat $GREBI_INGEST_FILENAME |
      grebi_ingest_ols
        --ontologies cheminf
        --skip-obsolete'