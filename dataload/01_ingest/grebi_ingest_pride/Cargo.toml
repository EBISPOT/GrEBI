[package]
name = "grebi_ingest_pride"
version = "0.1.0"
edition = "2021"
description = "The PRIDE projects export as metadata-only GrEBI JSONL"

[dependencies]
serde_json = { version = "1.0.108", features = ["preserve_order"] }
struson = { version = "0.6.0", features = ["serde"] }
regex = "1"

[dev-dependencies]
grebi_golden = { path = "../../test_support/grebi_golden" }
