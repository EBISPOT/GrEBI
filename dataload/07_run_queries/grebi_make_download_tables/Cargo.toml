[package]
name = "grebi_make_download_tables"
version = "0.1.0"
edition = "2021"
description = "A materialised query's result rows (JSON lines) as the table files of a release: CSV and Parquet"

[dependencies]
clap = { version = "4.4.11", features = ["derive"] }
grebi_shared = { path = "../../grebi_shared" }
serde_json = { version = "1.0.108", features = ["preserve_order", "arbitrary_precision"] }
csv = "1.3.0"
arrow = "59"
parquet = { version = "59", features = ["arrow"] }

[dev-dependencies]
grebi_golden = { path = "../../test_support/grebi_golden" }
arrow-json = "59"
