[package]
name = "grebi_jsonl2csv"
version = "0.1.0"
edition = "2021"
description = "Query result rows (JSON lines) to CSV, streaming: lists joined with semicolons, objects as JSON"

[dependencies]
serde_json = { version = "1.0.108", features = ["preserve_order", "arbitrary_precision"] }
csv = "1.3.0"
tempfile = "3"

[dev-dependencies]
grebi_golden = { path = "../../test_support/grebi_golden" }
