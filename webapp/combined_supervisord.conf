[supervisord]
nodaemon=true
logfile=./supervisord.log
pidfile=./supervisord.pid

[program:neo4j]
command=bash -c "NEO4J_DIR=$(ls -d *_neo4j 2>/dev/null | head -1) && export NEO4J_server_memory_heap_initial__size=${GREBI_NEO_HEAP:-512m} && export NEO4J_server_memory_heap_max__size=${GREBI_NEO_HEAP:-512m} && cp -r $NEO4J_DIR/conf /tmp/neo4j_conf && echo 'server.default_listen_address=0.0.0.0' >> /tmp/neo4j_conf/neo4j.conf && export NEO4J_CONF=/tmp/neo4j_conf && exec $NEO4J_DIR/bin/neo4j console"
directory=.
autostart=true
autorestart=true
startsecs=10
stdout_logfile=./neo4j.log
stderr_logfile=./neo4j_err.log

[program:postgres]
command=bash -c "if [ -n \"$GREBI_POSTGRES_DATA\" ]; then PGDATA=$GREBI_POSTGRES_DATA; else PGDATA=$(ls -d postgres_data_* 2>/dev/null | head -1); fi && if [ -n \"$GREBI_PG_USER\" ]; then chown -R $GREBI_PG_USER $PGDATA; fi && rm -f $PGDATA/postmaster.pid && exec postgres -D $PGDATA -p 5432 -c listen_addresses='*' -c shared_buffers=${GREBI_PG_SHARED_BUFFERS:-128MB} -c work_mem=${GREBI_PG_WORK_MEM:-64MB} -c maintenance_work_mem=${GREBI_PG_MAINTENANCE_WORK_MEM:-256MB} -c max_wal_size=${GREBI_PG_MAX_WAL_SIZE:-1GB}"
user=grebi
directory=.
autostart=true
autorestart=true
startsecs=5
stdout_logfile=./postgres.log
stderr_logfile=./postgres_err.log

[program:solr]
command=bash -c "SOLR_DIR=$(ls -d /data/solr 2>/dev/null || echo /opt/solr/server/solr) && export SOLR_HEAP=${GREBI_SOLR_HEAP:-512m} && export SOLR_JETTY_HOST=0.0.0.0 && exec /opt/solr/bin/solr start -f -p 8983 -s $SOLR_DIR --force"
directory=/opt/solr
autostart=true
autorestart=true
startsecs=10
stdout_logfile=./solr.log
stderr_logfile=./solr_err.log

[program:prefix_service]
command=/usr/local/bin/grebi_prefix_service
directory=/opt
autostart=true
autorestart=true
stdout_logfile=./prefix_service.log
stderr_logfile=./prefix_service_err.log
environment=ROCKET_ADDRESS="0.0.0.0",ROCKET_PORT="8082",GREBI_PREFIX_MAP_PATH="/opt/grebi/data/prefix_maps/prefix_map_normalise.json"

[program:resolver_service]
command=java -jar /opt/grebi_resolver_service.jar
directory=/opt
autostart=true
autorestart=true
stdout_logfile=./resolver_service.log
stderr_logfile=./resolver_service_err.log
environment=GREBI_RESOLVER_PORT="8084"

[program:metadata_service]
command=java -jar /opt/grebi_metadata_service.jar
directory=/opt
autostart=true
autorestart=true
stdout_logfile=./metadata_service.log
stderr_logfile=./metadata_service_err.log

[program:api]
command=java -jar /opt/grebi_api.jar
directory=/opt
autostart=true
autorestart=true
startsecs=30
stdout_logfile=./api.log
stderr_logfile=./api_err.log
environment=GREBI_NEO4J_HOST="bolt://localhost:7687/",GREBI_SOLR_HOST="http://localhost:8983/",GREBI_POSTGRES_HOST="localhost",GREBI_POSTGRES_PORT="5432",GREBI_POSTGRES_USER="grebi",GREBI_POSTGRES_DB="grebi",GREBI_RESOLVER_HOST="http://localhost:8084/",GREBI_METADATA_HOST="http://localhost:8081/",GREBI_PREFIX_HOST="http://localhost:8082/"

[program:ui]
command=bash -c "cd /opt/grebi_ui && REACT_APP_APIURL=http://localhost:8090/ REACT_APP_ENV=ebi npm run build && sleep 2 && caddy run --config ./Caddyfile --adapter caddyfile"
directory=/opt/grebi_ui
autostart=true
autorestart=false
startsecs=30
stdout_logfile=./ui.log
stderr_logfile=./ui_err.log
