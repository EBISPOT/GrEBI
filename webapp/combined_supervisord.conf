[supervisord]
nodaemon=true
logfile=./logs/supervisord.log
pidfile=./logs/supervisord.pid

[program:cypher_service]
command=java --add-modules jdk.incubator.vector -jar /opt/grebi_cypher_service.jar
directory=.
autostart=true
autorestart=true
startsecs=10
stdout_logfile=./logs/cypher_service.log
stderr_logfile=./logs/cypher_service_err.log
environment=GREBI_NEO4J_DATA_SEARCH_PATH=".",GREBI_CYPHER_PORT="8085"

[program:neo4j]
command=bash -c "NEO4J_HOME=$(ls -d *_neo4j 2>/dev/null | head -1) && cp -r $NEO4J_HOME/conf /tmp/neo4j_conf && sed -i 's/^#*server.default_listen_address=.*/server.default_listen_address=0.0.0.0/' /tmp/neo4j_conf/neo4j.conf && grep -q 'add-modules jdk.incubator.vector' /tmp/neo4j_conf/neo4j.conf || echo 'server.jvm.additional=--add-modules jdk.incubator.vector' >> /tmp/neo4j_conf/neo4j.conf && if [ -n \"$GREBI_NEO_HEAP\" ]; then sed -i \"s/^#*server.memory.heap.initial_size=.*/server.memory.heap.initial_size=$GREBI_NEO_HEAP/\" /tmp/neo4j_conf/neo4j.conf && sed -i \"s/^#*server.memory.heap.max_size=.*/server.memory.heap.max_size=$GREBI_NEO_HEAP/\" /tmp/neo4j_conf/neo4j.conf && sed -i \"s/^#*server.memory.pagecache.size=.*/server.memory.pagecache.size=$GREBI_NEO_HEAP/\" /tmp/neo4j_conf/neo4j.conf; fi && NEO4J_CONF=/tmp/neo4j_conf exec $NEO4J_HOME/bin/neo4j console"
directory=.
autostart=true
autorestart=true
startsecs=15
stdout_logfile=./logs/neo4j.log
stderr_logfile=./logs/neo4j_err.log
environment=NEO4J_AUTH="none"

[program:postgres]
command=bash -c "if [ -n \"$GREBI_POSTGRES_DATA\" ]; then PGDATA=$GREBI_POSTGRES_DATA; else PGDATA=$(ls -d postgres_data* 2>/dev/null | head -1); fi && if [ -n \"$GREBI_PG_USER\" ]; then chown -R $GREBI_PG_USER $PGDATA; fi && rm -f $PGDATA/postmaster.pid && exec postgres -D $PGDATA -p 5432 -c listen_addresses='*' -c shared_buffers=${GREBI_PG_SHARED_BUFFERS:-128MB} -c work_mem=${GREBI_PG_WORK_MEM:-64MB} -c maintenance_work_mem=${GREBI_PG_MAINTENANCE_WORK_MEM:-256MB} -c max_wal_size=${GREBI_PG_MAX_WAL_SIZE:-1GB}"
user=%(ENV_GREBI_PG_USER)s
directory=.
autostart=true
autorestart=true
startsecs=5
stdout_logfile=./logs/postgres.log
stderr_logfile=./logs/postgres_err.log

[program:api]
command=java -jar /opt/grebi_api.jar
directory=/opt
autostart=true
autorestart=true
startsecs=30
stdout_logfile=./logs/api.log
stderr_logfile=./logs/api_err.log
environment=GREBI_CYPHER_HOST="http://localhost:8085",GREBI_POSTGRES_HOST="localhost",GREBI_POSTGRES_PORT="5432",GREBI_POSTGRES_USER="grebi",GREBI_POSTGRES_DB="grebi"

[program:ui]
command=bash -c "cd /opt/grebi_ui && REACT_APP_APIURL=http://localhost:8090/ REACT_APP_ENV=ebi npm run build && sleep 2 && caddy run --config ./Caddyfile --adapter caddyfile"
directory=/opt/grebi_ui
autostart=true
autorestart=false
startsecs=30
stdout_logfile=./logs/ui.log
stderr_logfile=./logs/ui_err.log
