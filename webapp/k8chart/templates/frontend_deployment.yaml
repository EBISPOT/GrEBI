apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-frontend
  labels:
    app: {{ .Release.Name }}-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-frontend
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-frontend
    spec:
      automountServiceAccountToken: false
      # No pod-level runAsNonRoot: the grebi_ui image bakes a non-numeric USER
      # (grebi), which the kubelet can't verify as non-root; it already runs as
      # that non-root user from the image. (Matches the live dev deployment.)
      containers:
        - name: web
          image: ghcr.io/ebispot/grebi_ui:{{.Values.imageTag}}
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: 1Gi
              cpu: 0.25
            limits:
              memory: 1Gi
              cpu: 0.5
          ports:
            - containerPort: 8080
          env:
            - name: REACT_APP_ENV
              value: ebi
            - name: REACT_APP_APIURL
              value: {{ .Values.apiUrl }}
            - name: PUBLIC_URL
              value: {{ .Values.contextPath }}
            - name: GREBI_MINIFY
              value: 'true'
          command: ["/bin/bash", "-c"]
          args: ["/opt/grebi_ui/entrypoint.dockersh"]
