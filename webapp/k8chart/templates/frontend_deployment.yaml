apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-frontend
  labels:
    app: {{ .Release.Name }}-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-frontend
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-frontend
    spec:
      automountServiceAccountToken: false
      # No pod-level runAsNonRoot: the grebi_ui image bakes a non-numeric USER
      # (grebi), which the kubelet can't verify as non-root; it already runs as
      # that non-root user from the image. (Matches the live dev deployment.)
      containers:
        - name: web
          image: ghcr.io/ebispot/grebi_ui:{{.Values.imageTag}}
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          # The bundle build on start peaks close to 1Gi (esbuild for bundle.js
          # and widgets.js, then the styles): at a 1Gi limit the pod was
          # OOM-killed mid-build, twice in a row on dev on 2026-11-08, and the
          # UI answered 500 until a retry got through. Measured at 2Gi: ~900Mi
          # peak, ready in 35 s.
          resources:
            requests:
              memory: 2Gi
              cpu: 0.25
            limits:
              memory: 2Gi
              cpu: 0.5
          ports:
            - containerPort: 8080
          # the container builds the bundle on start, for minutes: a pod takes
          # traffic, and replaces the old one, only once the bundle is there
          readinessProbe:
            httpGet:
              path: {{ .Values.contextPath }}/bundle.js
              port: 8080
            periodSeconds: 10
            failureThreshold: 90
          env:
            - name: REACT_APP_ENV
              value: ebi
            - name: REACT_APP_APIURL
              value: {{ .Values.apiUrl }}
            - name: PUBLIC_URL
              value: {{ .Values.contextPath }}
            - name: GREBI_MINIFY
              value: 'true'
          command: ["/bin/bash", "-c"]
          args: ["/opt/grebi_ui/entrypoint.dockersh"]
