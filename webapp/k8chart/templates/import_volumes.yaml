###
### Read-only NFS mount to copy data from.
###
### PersistentVolumes are CLUSTER-scoped, and dev + prod use the same Helm
### release name ("grebi"), so the PV name must include the namespace to keep
### the two deployments from colliding on a shared PV (which would let one
### environment hijack the other's import mount). PVCs are namespaced, so their
### name can stay per-release.
###
apiVersion: v1
kind: PersistentVolume
metadata:
  annotations:
  finalizers:
  - kubernetes.io/pv-protection
  name: {{ .Release.Name }}-{{ .Release.Namespace }}-import-pv
spec:
  accessModes: ['ReadWriteMany']
  storageClassName: standard-nfs-production
  volumeMode: Filesystem
  mountOptions: ['nfsvers=3']
  nfs:
    server: {{ .Values.importNfs.server }}
    path: {{ .Values.importNfs.path }}
  capacity: 
    storage: 2Ti
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{.Release.Name}}-import-pvc
spec:
  storageClassName: standard-nfs-production
  volumeName: {{ .Release.Name }}-{{ .Release.Namespace }}-import-pv
  accessModes: ['ReadWriteMany']
  resources:
    requests:
      storage: 1000Gi