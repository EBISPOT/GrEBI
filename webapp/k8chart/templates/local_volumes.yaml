###
### Read-write local disk on the pinned worker node, used to serve the Neo4j
### store.  The cypher-service initContainer copies the store here from the
### read-only NFS import mount, then serves it from local disk (fast).
###
### One PV+PVC per release (PV names are cluster-scoped, so dev and prod must
### differ), pinned to worker-{{ .Values.neo_worker_n }}.  dev = worker-1,
### prod = worker-2 — different nodes, so the shared /var/local-disk path is safe.
###
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Release.Name }}-local-pv
  finalizers:
  - kubernetes.io/pv-protection
spec:
  accessModes: ['ReadWriteMany']
  capacity:
    storage: {{ .Values.local_disk }}
  local:
    path: /var/local-disk
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - hh-rke-wp-webadmin-58-worker-{{ .Values.neo_worker_n }}.caas.ebi.ac.uk
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  volumeMode: Filesystem
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-local-pvc
spec:
  storageClassName: local-storage
  volumeName: {{ .Release.Name }}-local-pv
  accessModes: ['ReadWriteMany']
  resources:
    requests:
      storage: {{ .Values.local_disk }}
