###
### Claim the configured pre-existing local-disk PV.
###
### These per-node PVs are shared cluster infrastructure created earlier (when the
### local-storage StorageClass with WaitForFirstConsumer binding existed), so they
### carry node topology and are schedulable. New local PVs created now would bind
### "Immediate" with no topology and be unschedulable, so we reuse the existing PV:
### we only create the PVC bound to it, we do NOT create the PV.
###
### dev keeps worker-1-local-pv. prod uses a separately managed PV object for
### worker-2, preventing the legacy dev Helm release from owning prod storage.
###
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: worker-{{ .Values.neo_worker_n }}-local-pvc
spec:
  storageClassName: local-storage
  volumeName: {{ .Values.localPvName }}
  accessModes: ['ReadWriteMany']
  resources:
    requests:
      storage: {{ .Values.local_disk }}
