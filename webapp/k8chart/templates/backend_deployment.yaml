apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    app: {{ .Release.Name }}-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-backend
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-backend
    spec:
      {{- $postgresSecretName := include "grebi.postgresSecretName" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: {{ .Release.Name }}-import
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-import-pvc
      containers:
        - name: web
          image: ghcr.io/ebispot/grebi_api:{{.Values.imageTag}}
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - mountPath: "/data_import"
              name: {{ .Release.Name }}-import
              readOnly: true
          ports:
            - containerPort: 8090
          # The JVM takes a minute or two to serve (Postgres pool, graph
          # metadata, the example edge-count prewarm). Without these probes a
          # rollout marked the new pod Ready the moment its container started
          # and killed the old one in the same breath, so the site answered
          # nothing for the whole warm-up (seen on 2026-11-04). The startup
          # probe gives it five minutes; readiness then keeps traffic off a
          # replica that stops answering. No liveness probe: with one replica
          # a long GC pause must not become a restart.
          startupProbe:
            httpGet:
              path: {{ .Values.contextPath }}/api/v1/graphs
              port: 8090
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: {{ .Values.contextPath }}/api/v1/graphs
              port: 8090
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: 8Gi
              cpu: {{ .Values.backend.cpu }}
            limits:
              memory: 8Gi
              cpu: {{ .Values.backend.cpu }}
          envFrom:
            - secretRef:
                name: {{ $postgresSecretName }}
          env:
            {{- if .Values.cypher.enabled }}
            - name: GREBI_CYPHER_HOST
              value: http://{{ .Release.Name }}-cypher-service:8085
            {{- end }}
            - name: GREBI_CONTEXT_PATH
              value: {{ .Values.contextPath }}
            # UseG1GC is set explicitly: the JVM only auto-selects it when it sees
            # >=2 CPUs, so a low cpu limit silently drops it to SerialGC, whose
            # full collections stop the whole API for seconds on this heap size.
            - name: JDK_JAVA_OPTIONS
              value: "-XX:InitialRAMPercentage=60.0 -XX:MinRAMPercentage=60.0 -XX:MaxRAMPercentage=80.0 -XX:+UseG1GC"
            - name: GREBI_QUERY_TEMPLATES_PATH
              value: /data_import/query_templates
            - name: GREBI_EMBEDDING_SERVICE_URL
              value: {{ .Values.embeddingServiceUrl | quote }}
              
