apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    app: {{ .Release.Name }}-backend
spec:
  type: NodePort
  ports:
  - name: "application"
    port: 8090
  selector:
    app: {{ .Release.Name }}-backend
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-frontend
  labels:
    app: {{ .Release.Name }}-frontend
spec:
  type: NodePort
  ports:
  - name: "application"
    port: 8080
  selector:
    app: {{ .Release.Name }}-frontend
