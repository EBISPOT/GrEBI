apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    app: {{ .Release.Name }}-backend
spec:
  type: NodePort
  ports:
  - name: "application"
    port: 8090
  selector:
    app: {{ .Release.Name }}-backend
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-frontend
  labels:
    app: {{ .Release.Name }}-frontend
spec:
  type: NodePort
  ports:
  - name: "application"
    port: 8080
  selector:
    app: {{ .Release.Name }}-frontend
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-cypher-service
  labels:
    app: {{ .Release.Name }}-cypher-service
spec:
  ports:
      - port: 8085
        targetPort: 8085
        name: http
        protocol: TCP
  selector:
    app: {{ .Release.Name }}-cypher-service
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-resolver
  labels:
    app: {{ .Release.Name }}-resolver
spec:
  ports:
      - port: 8084
        targetPort: 8084
        name: http
        protocol: TCP
  selector:
    app: {{ .Release.Name }}-resolver
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-solr
  labels:
    app: {{ .Release.Name }}-solr
spec:
  ports:
      - port: 8983
        targetPort: 8983
        name: http
        protocol: TCP
  selector:
    app: {{ .Release.Name }}-solr
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    app: {{ .Release.Name }}-postgres
spec:
  ports:
      - port: 5432
        targetPort: 5432
        name: postgres
        protocol: TCP
  selector:
    app: {{ .Release.Name }}-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-metadata-service
  labels:
    app: {{ .Release.Name }}-metadata-service
spec:
  ports:
      - port: 8081
        targetPort: 8081
        name: http
        protocol: TCP
  selector:
    app: {{ .Release.Name }}-metadata-service
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-prefix-service
  labels:
    app: {{ .Release.Name }}-prefix-service
spec:
  ports:
      - port: 8082
        targetPort: 8082
        name: http
        protocol: TCP
  selector:
    app: {{ .Release.Name }}-prefix-service
