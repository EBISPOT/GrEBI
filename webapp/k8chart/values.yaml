
imageTag: dev

# The deployment serves everything from PostgreSQL (postgres.secret below): there
# is no Neo4j in it. The dataload still builds a Neo4j database, to run the
# query templates against when it materialises them, and publishes it on the FTP.

# Read-only NFS mount the API reads the query templates from (the "current" data release).
# Override importNfs.path per environment:
#   dev  = /ifs/public/rw/ontoapps/grebi/current
#   prod = /ifs/public/rw/ontoapps/grebi/prod/current
importNfs:
  server: hh-isi-srv-vlan1496.ebi.ac.uk
  path: /ifs/public/rw/ontoapps/grebi/current

# URL path the app is hosted under (backend context path + UI base path).
# Same for both deployments now (/grebi, was /kg).
contextPath: "/grebi"

# Public base URL the UI calls the API on. The path is /grebi; the host differs
# per environment, so override apiUrl for prod once the prod URL is routed.
#   dev  = https://wwwdev.ebi.ac.uk/grebi/
#   prod = https://www.ebi.ac.uk/grebi/   (pending)
apiUrl: "https://wwwdev.ebi.ac.uk/grebi/"

# The embedding service runs in the ontoapps namespace. The short service name
# works for dev; prod overrides this with the cross-namespace cluster FQDN.
embeddingServiceUrl: "http://spot-embedding-service:5000/spot/embed"

# API backend CPU (request and limit are set to the same value). Needs to be >=2
# so the JVM doesn't fall back to a single-threaded GC; see the UseG1GC note in
# templates/backend_deployment.yaml.
backend:
  cpu: 2

postgres:
  secret:
    name: ""
