# Parameterised template materialised as counts only: rows live, total from Postgres.
title: Studies per trait
question: How many [studies]{study} are annotated with {trait_id}?
description: Counts-only materialisation.
graphs:
  - g1
topics:
  - gwas
cypher_match_fragment: |-
  MATCH (trait)-[:sourceId]->(:Id { id: $trait_id })
  MATCH (study:`gwas:Study`)-[:`gwas:mapped_trait`]->(trait)
cypher_return_fragment: |-
  RETURN study { .id } AS study
cypher_count_fragment: |-
  RETURN count(*) AS count
params:
  - param_id: trait_id
    param_name: Trait
    param_type: SourceId
result_columns:
  - column_id: study
    column_type: GraphNodeId
materialise:
  mode: counts_only
examples:
  - title: psoriasis
    params:
      trait_id: mondo:0005083
