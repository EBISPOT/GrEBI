# Live (cypher) parameterised template, graph g1 only.
title: GWAS studies annotated with a trait
question: Which GWAS [studies]{study} are annotated with {trait_id}?
description: Studies whose mapped trait is the given term.
graphs:
  - g1
topics:
  - gwas
cypher_match_fragment: |-
  MATCH (trait)-[:sourceId]->(:Id { id: $trait_id })
  MATCH (study:`gwas:Study`)-[assoc:`gwas:mapped_trait`]->(trait)
cypher_return_fragment: |-
  RETURN DISTINCT trait { .id } AS trait, study { .id } AS study,
      study.accession[0] AS study_accession, assoc.p_value AS p_value, assoc.edge_id AS edge_id
cypher_count_fragment: |-
  WITH DISTINCT trait, study
  RETURN count(*) AS count
params:
  - param_id: trait_id
    param_name: Trait
    param_type: SourceId
result_columns:
  - column_id: trait
    column_type: GraphNodeId
  - column_id: study
    column_type: GraphNodeId
  - column_id: study_accession
    column_type: string
  - column_id: p_value
    column_type: float
    optional: true
  - column_id: edge_id
    column_type: EdgeId
examples:
  - title: psoriasis
    params:
      trait_id: mondo:0005083
materialise: false
