title: Search MetaboLights by chemical or chemical classification
question: What [MetaboLights studies]{study} involve {chemical_id}?
graphs:
  - ebi_monarch_xspecies
topics:
  - chebi
  - metabolights
  - metabolomics
cypher_match_fragment: |-
  // base-keyed / param-as-closure-root form: chemical is the base the row is
  // about; the queried chemical (chemical_root) is reached via the precomputed
  // broad_match closure, so chemical is the queried term or one of its
  // subclasses. A single broad_match hop suffices (it is a full transitive
  // closure) and, unlike the old unbounded `*0..` roll-up, produces one path
  // per (chemical, study) pair instead of one per subclass chain.
  MATCH (chemical:`biolink:ChemicalEntity`)-[:`biolink:broad_match`*0..1]->(chemical_root)-[:sourceId]->(:Id { id: $chemical_id })
  MATCH (study:`metabolights:Study`)-[:`metabolights:ref`]->(chemical)
cypher_return_fragment: |-
  RETURN DISTINCT
    chemical { .id, .`grebi:nodeId`, .`grebi:name`,`grebi:type`: labels(chemical) } AS chemical,
    study { .id, .`grebi:nodeId`, .`grebi:name`,`grebi:type`: labels(study) } AS study
cypher_count_fragment: |-
  WITH DISTINCT chemical, study
  RETURN count(*) AS count
params:
  - param_id: chemical_id
    param_name: Chemical
    param_type: SourceId
    values_with_type: 'biolink:ChemicalEntity'
result_columns:
  - column_id: chemical
    column_type: GraphNodeId
    facet: true
  - column_id: study
    column_type: GraphNodeId
examples:
  - title: glucose
    params:
      chemical_id: chebi:17234
  - title: lactate
    params:
      chemical_id: chebi:24996
  - title: ATP
    params:
      chemical_id: chebi:15422
materialise:
  mode: full
