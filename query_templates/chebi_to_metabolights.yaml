title: Search MetaboLights by chemical or chemical classification
question: What [MetaboLights studies]{study} involve {chemical_id}?
graphs:
  - ebi_monarch_xspecies
topics:
  - chebi
  - metabolights
  - metabolomics
cypher_match_fragment: |-
  MATCH (chemical:`biolink:ChemicalEntity`)-[:sourceId]->(:Id { id: $chemical_id })
  MATCH (subclass)-[:`biolink:broad_match`*0..]->(chemical)
  MATCH (study:`metabolights:Study`)-[:`metabolights:ref`]->(subclass)
cypher_return_fragment: |-
  RETURN DISTINCT
    subclass { .id, .`grebi:nodeId`, .`grebi:name`,`grebi:type`: labels(subclass) } AS chemical,
    study { .id, .`grebi:nodeId`, .`grebi:name`,`grebi:type`: labels(study) } AS study
cypher_count_fragment: |-
  WITH DISTINCT subclass, study
  RETURN count(*) AS count
params:
  - param_id: chemical_id
    param_name: Chemical
    param_type: SourceId
    param_opts:
      'biolink:broad_match': 'biolink:ChemicalEntity'
result_columns:
  - column_id: chemical
    column_type: GraphNodeId
  - column_id: study
    column_type: GraphNodeId
examples:
  - title: glucose
    params:
      chemical_id: chebi:17234
  - title: lactate
    params:
      chemical_id: chebi:24996
  - title: ATP
    params:
      chemical_id: chebi:15422
materialise:
  mode: full
  params:
    - param_id: chemical_id
      filters_column: chemical
      closure: descendants
      domain_kind: label
      domain_root: 'biolink:ChemicalEntity'
