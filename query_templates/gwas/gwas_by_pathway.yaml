title: Search GWAS Catalog by Reactome pathway
question: Which GWAS [SNPs]{snp} are linked to genes in {pathway_id}?
graphs:
  - ebi_monarch_xspecies
topics:
  - gwas_catalog
  - reactome
cypher_match_fragment: |-
  MATCH (pathway:`reactome:Pathway`)-[:sourceId]->(:Id { id: $pathway_id })
  MATCH (pathway)-[:`reactome:hasEvent`*]->(reaction_like_event)
  MATCH (reaction_like_event)-[:`reactome:input`|`reactome:output`|`reactome:catalystActivity`|`reactome:physicalEntity`|`reactome:regulatedBy`|`reactome:regulator`|`reactome:hasComponent`|`reactome:hasMember`|`reactome:hasCandidate`*]->(physical_entity)
  MATCH (physical_entity)-[:`reactome:referenceEntity`]->(reference_gene_product)
  WHERE 'reactome:ReferenceGeneProduct' IN labels(reference_gene_product)
  MATCH (reference_gene_product)-[:`reactome:referenceGene`]->(reactome_gene)
  WITH DISTINCT
      reference_gene_product,
      [name in reactome_gene.`grebi:name` WHERE name STARTS WITH 'ensembl:ENSG' OR name STARTS WITH 'hgnc:'] AS gene_source_names,
      pathway
  UNWIND gene_source_names AS gene_source_name
  WITH DISTINCT
      reference_gene_product,
      split(gene_source_name, ' ')[0] AS gene_source_id,
      pathway
  MATCH (gene)-[:sourceId]->(:Id { id: gene_source_id })
  WHERE gene.`hgnc:symbol`[0] = reference_gene_product.`reactome:name`[0]
  MATCH (gene)<-[:(`gwas:mapped_gene`|`gwas:snp_gene_ids`|`gwas:upstream_gene_id`|`gwas:downstream_gene_id`)]-(snp)
  MATCH (snp)-[assoc:`gwas:associated_with`]->(trait)
  WITH
      pathway,
      gene,
      snp,
      trait,
      [id in assoc.`gwas:study` WHERE id =~ "GCST.*" | id][0] AS study_id,
      assoc.`gwas:strongest_snp_risk_allele`[0] AS effect_allele,
      assoc.`gwas:p_value`[0] AS p_value,
      assoc.`gwas:or_or_beta`[0] AS or_or_beta,
      assoc.edge_id AS edge_id
  MATCH
      (study:`gwas:Study`)-[:sourceId]->(:Id { id: study_id })
cypher_return_fragment: |-
  RETURN DISTINCT
      pathway { .id, .`grebi:nodeId`, .`grebi:name`,`grebi:type`: labels(pathway) } AS pathway,
      gene { .id, .`grebi:nodeId`, .`grebi:name`,`grebi:type`: labels(gene) } AS gene,
      snp { .id, .`grebi:nodeId`, .`grebi:name`,`grebi:type`: labels(snp) } AS snp,
      effect_allele,
      trait { .id, .`grebi:nodeId`, .`grebi:name`,`grebi:type`: labels(trait) } AS trait,
      study_id AS study_accession,
      study.`gwas:pubmedid`[0] AS pubmed_id,
      p_value,
      or_or_beta,
      edge_id
cypher_count_fragment: |-
  WITH DISTINCT pathway, gene, snp, trait, study, or_or_beta, edge_id
  RETURN count(*) AS count
params:
  - param_id: pathway_id
    param_name: Reactome Pathway
    param_type: SourceId
    values_with_type: 'reactome:Pathway'
result_columns:
  - column_id: pathway
    column_type: GraphNodeId
    facet: true
  - column_id: gene
    column_type: GraphNodeId
  - column_id: snp
    column_type: GraphNodeId
  - column_id: effect_allele
    column_type: string
  - column_id: trait
    column_type: GraphNodeId
  - column_id: study_accession
    column_type: string
  - column_id: p_value
    column_type: string
  - column_id: pubmed_id
    column_type: string
  - column_id: or_or_beta
    column_type: float
    optional: true
  - column_id: edge_id
    column_type: EdgeId
examples:
  - title: Glycolysis
    params:
      pathway_id: reactome:R-HSA-70171
  - title: Citric acid cycle
    params:
      pathway_id: reactome:R-HSA-71403
  - title: Wnt signaling
    params:
      pathway_id: reactome:R-HSA-195721
# Materialised over every Reactome pathway (values_with_type drops the Id
# anchor, keeping the label). Size is unknown until the first run — per-pathway
# results run 6k-21k rows and hasEvent* rolls sub-pathways up into their
# parents — so the budget is generous; the recorded num_results decides whether
# it stays.
materialise:
  mode: full
  budget_rows: 40000000
