title: Search GWAS Catalog by gene and anatomical location
question: What GWAS [traits]{trait} are associated with {gene_id} in {location_id}?
graphs:
  - ebi_monarch_xspecies
topics:
  - gwas_catalog
  - uberon
cypher_match_fragment: |-
  MATCH (gene:`hgnc:Gene`)-[:sourceId]->(:Id {id: $gene_id })
  MATCH (location)-[:sourceId]->(:Id {id: $location_id })
  MATCH (location)<-[r:(`ro:characteristic_of`|`ro:characteristic_of_part_of`|`iao:is_about`|`biolink:has_participant`|`biolink:disease_has_location`|`efo:has_disease_location`)]-(trait)
  MATCH (snp:`gwas:SNP`)-[assoc:`gwas:associated_with`]->(trait)
  MATCH (gene)<-[:(`gwas:mapped_gene`|`gwas:snp_gene_ids`|`gwas:upstream_gene_id`|`gwas:downstream_gene_id`)]-(snp)
  WITH
      gene,
      location,
      trait,
      snp,
      [id in assoc.`gwas:study` WHERE id =~ "GCST.*" | id][0] AS study_id,
      assoc.`gwas:strongest_snp_risk_allele`[0] AS effect_allele,
      assoc.`gwas:p_value`[0] AS p_value,
      assoc.`gwas:or_or_beta`[0] AS or_or_beta,
      assoc.edge_id AS edge_id
  MATCH
      (study:`gwas:Study`)-[:sourceId]->(:Id { id: study_id })
cypher_return_fragment: |-
  RETURN DISTINCT
      location { .id, .`grebi:nodeId`, .`grebi:name`,`grebi:type`: labels(location) } AS location,
      trait { .id, .`grebi:nodeId`, .`grebi:name`,`grebi:type`: labels(trait) } AS trait,
      snp { .id, .`grebi:nodeId`, .`grebi:name`,`grebi:type`: labels(snp) } AS snp,
      effect_allele,
      gene { .id, .`grebi:nodeId`, .`grebi:name`,`grebi:type`: labels(gene) } AS gene,
      study_id AS study_accession,
      study.`gwas:pubmedid`[0] AS pubmed_id,
      p_value,
      or_or_beta,
      edge_id
cypher_count_fragment: |-
  WITH DISTINCT gene, location, trait, snp, study, or_or_beta, edge_id
  RETURN count(*) AS count
params:
  - param_id: gene_id
    param_name: Gene
    param_type: SourceId
    values_with_type: 'hgnc:Gene'
  - param_id: location_id
    param_name: Anatomical Location
    param_type: SourceId
    values_under: 'uberon:0001062'
result_columns:
  - column_id: location
    column_type: GraphNodeId
    facet: true
  - column_id: trait
    column_type: GraphNodeId
    facet: true
  - column_id: snp
    column_type: GraphNodeId
  - column_id: effect_allele
    column_type: string
  - column_id: gene
    column_type: GraphNodeId
  - column_id: study_accession
    column_type: string
  - column_id: p_value
    column_type: string
  - column_id: pubmed_id
    column_type: string
  - column_id: or_or_beta
    column_type: float
    optional: true
  - column_id: edge_id
    column_type: EdgeId
examples:
  - title: PNPLA3 in liver
    params:
      gene_id: hgnc:18590
      location_id: uberon:0002107
  - title: PHGDH in retina
    params:
      gene_id: hgnc:8923
      location_id: uberon:0000966
materialise:
  mode: full
