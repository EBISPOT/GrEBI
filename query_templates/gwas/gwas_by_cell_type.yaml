title: Search GWAS Catalog by cell type
question: What GWAS studies have [traits]{trait} affecting cells of type {cell_type_id}?
graphs:
  - ebi_monarch_xspecies
topics:
  - gwas_catalog
  - cl
cypher_match_fragment: |-
  MATCH (cl_root)-[:sourceId]->(:Id {id: $cell_type_id })
  // include subclasses of the requested cell type (e.g. basal cell of epidermis under keratinocyte)
  MATCH (cl_term)-[:(`biolink:subclass_of`|`biolink:broad_match`)*0..1]->(cl_root)
  MATCH (cl_term)<-[r:(`ro:characteristic_of`|`ro:characteristic_of_part_of`|`iao:is_about`|`biolink:has_participant`|`biolink:disease_has_location`|`efo:has_disease_location`)]-(matched_trait)
  // include subclasses of the matched trait (e.g. basal cell carcinoma under keratinocyte carcinoma)
  MATCH (trait)-[:(`biolink:subclass_of`|`biolink:broad_match`)*0..1]->(matched_trait)
  MATCH (snp:`gwas:SNP`)-[assoc:`gwas:associated_with`]->(trait)
  OPTIONAL MATCH (gene)<-[:(`gwas:mapped_gene`|`gwas:snp_gene_ids`|`gwas:upstream_gene_id`|`gwas:downstream_gene_id`)]-(snp)
  WITH
      cl_term,
      trait,
      snp,
      gene,
      [id in assoc.`gwas:study` WHERE id =~ "GCST.*" | id][0] AS study_id,
      assoc.`gwas:strongest_snp_risk_allele`[0] AS effect_allele,
      assoc.`gwas:p_value`[0] AS p_value,
      assoc.`gwas:or_or_beta`[0] AS or_or_beta,
      assoc.edge_id AS edge_id
  MATCH
      (study:`gwas:Study`)-[:sourceId]->(:Id { id: study_id })
cypher_return_fragment: |-
  RETURN DISTINCT
      cl_term { .id, .`grebi:nodeId`, .`grebi:name`,`grebi:type`: labels(gene) } AS cell_type,
      trait { .id, .`grebi:nodeId`, .`grebi:name`,`grebi:type`: labels(trait) } AS trait,
      snp { .id, .`grebi:nodeId`, .`grebi:name`,`grebi:type`: labels(trait) } AS snp,
      effect_allele,
      gene { .id, .`grebi:nodeId`, .`grebi:name`,`grebi:type`: labels(trait) } AS gene,
      study_id AS study_accession,
      study.`gwas:pubmedid`[0] AS pubmed_id,
      p_value,
      or_or_beta,
      edge_id
cypher_count_fragment: |-
  WITH DISTINCT cl_term, trait, snp, gene, study, or_or_beta, edge_id
  RETURN count(*) AS count
params:
  - param_id: cell_type_id
    param_name: Cell Type
    param_type: SourceId
    param_opts:
      'biolink:broad_match': 'cl:0000000'
result_columns:
  - column_id: cell_type
    column_type: GraphNodeId
  - column_id: trait
    column_type: GraphNodeId
  - column_id: snp
    column_type: GraphNodeId
  - column_id: effect_allele
    column_type: string
  - column_id: gene
    column_type: GraphNodeId
    optional: true
  - column_id: study_accession
    column_type: string
  - column_id: p_value
    column_type: string
  - column_id: pubmed_id
    column_type: string
  - column_id: or_or_beta
    column_type: float
    optional: true
  - column_id: edge_id
    column_type: EdgeId
examples:
  - title: leukocyte
    params:
      cell_type_id: cl:0000738
  - title: blood cell
    params:
      cell_type_id: cl:0000081
  - title: platelet
    params:
      cell_type_id: cl:0000233
