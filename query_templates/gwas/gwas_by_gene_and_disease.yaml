title: Search GWAS Catalog by gene and disease context
question: What GWAS [traits]{trait} are associated with {gene_id} for {disease_id}?
graphs:
  - ebi_monarch_xspecies
topics:
  - gwas_catalog
cypher_match_fragment: |-
  MATCH (gene)-[:sourceId]->(:Id {id: $gene_id })
  MATCH (disease)-[:sourceId]->(:Id {id: $disease_id})
  WHERE 'OLS.mondo' IN disease.`grebi:datasources`
  MATCH (disease)<-[:`biolink:broad_match`*0..1]-(trait)
  MATCH (snp:`gwas:SNP`)-[assoc:`gwas:associated_with`]->(trait)
  MATCH (gene)<-[:(`gwas:mapped_gene`|`gwas:snp_gene_ids`|`gwas:upstream_gene_id`|`gwas:downstream_gene_id`)]-(snp)
  WITH
      gene,
      disease,
      trait,
      snp,
      [id in assoc.`gwas:study` WHERE id =~ "GCST.*" | id][0] AS study_id,
      assoc.`gwas:strongest_snp_risk_allele`[0] AS effect_allele,
      assoc.`gwas:p_value`[0] AS p_value,
      assoc.`gwas:or_or_beta`[0] AS or_or_beta,
      assoc.edge_id AS edge_id
  MATCH
      (study:`gwas:Study`)-[:sourceId]->(:Id { id: study_id })
cypher_return_fragment: |-
  RETURN DISTINCT
      disease { .id, .`grebi:nodeId`, .`grebi:name`,`grebi:type`: labels(disease) } AS disease,
      trait { .id, .`grebi:nodeId`, .`grebi:name`,`grebi:type`: labels(trait) } AS trait,
      snp { .id, .`grebi:nodeId`, .`grebi:name`,`grebi:type`: labels(snp) } AS snp,
      effect_allele,
      gene { .id, .`grebi:nodeId`, .`grebi:name`,`grebi:type`: labels(gene) } AS gene,
      study_id AS study_accession,
      study.`gwas:pubmedid`[0] AS pubmed_id,
      p_value,
      or_or_beta,
      edge_id
cypher_count_fragment: |-
  WITH DISTINCT gene, disease, trait, snp, study, or_or_beta, edge_id
  RETURN count(*) AS count
params:
  - param_id: gene_id
    param_name: Gene
    param_type: SourceId
    param_opts:
      'biolink:broad_match': 'hgnc:Gene'
  - param_id: disease_id
    param_name: Disease
    param_type: SourceId
    param_opts:
      'biolink:broad_match': 'mondo:0000001'
result_columns:
  - column_id: disease
    column_type: GraphNodeId
  - column_id: trait
    column_type: GraphNodeId
  - column_id: snp
    column_type: GraphNodeId
  - column_id: effect_allele
    column_type: string
  - column_id: gene
    column_type: GraphNodeId
  - column_id: study_accession
    column_type: string
  - column_id: p_value
    column_type: string
  - column_id: pubmed_id
    column_type: string
  - column_id: or_or_beta
    column_type: float
    optional: true
  - column_id: edge_id
    column_type: EdgeId
examples:
  - title: SP140 for Crohn disease
    params:
      gene_id: hgnc:17133
      disease_id: mondo:0005011
  - title: NOTCH4 for bronchiectasis
    params:
      gene_id: hgnc:7884
      disease_id: mondo:0004822
