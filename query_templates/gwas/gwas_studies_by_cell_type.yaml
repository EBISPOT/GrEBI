title: Search GWAS Catalog studies by cell type
question: What GWAS [studies]{study} report traits affecting cells of type {cell_type_id}?
graphs:
  - ebi_monarch_xspecies
topics:
  - gwas_catalog
  - cl
# Study-level counterpart of gwas_by_cell_type (issue #31): the same trait
# matching, but each row is a study annotated with the trait rather than one
# of its associations, so studies that report no significant association
# (but may have full summary statistics) are found too.
cypher_match_fragment: |-
  MATCH (cl_term)-[:`biolink:broad_match`*0..1]->(cl_root)-[:sourceId]->(:Id {id: $cell_type_id })
  MATCH (cl_term)<-[:(`ro:characteristic_of`|`ro:characteristic_of_part_of`|`iao:is_about`|`biolink:has_participant`|`biolink:disease_has_location`|`efo:has_disease_location`)]-(matched_trait)
  // include subclasses of the matched trait
  MATCH (trait)-[:`biolink:broad_match`*0..1]->(matched_trait)
  MATCH (study:`gwas:Study`)-[:`gwas:mapped_trait`]->(trait)
cypher_return_fragment: |-
  RETURN DISTINCT
      cl_term { .id, .`grebi:nodeId`, .`grebi:name`,`grebi:type`: labels(cl_term) } AS cell_type,
      trait { .id, .`grebi:nodeId`, .`grebi:name`,`grebi:type`: labels(trait) } AS trait,
      study { .id, .`grebi:nodeId`, .`grebi:name`,`grebi:type`: labels(study) } AS study,
      [id IN study.id WHERE id =~ "GCST.*" | id][0] AS study_accession,
      study.`gwas:disease_trait`[0] AS reported_trait,
      // property names differ between builds: ontology property equivalences
      // rename dcterms:creator/modified on graphs that load the biolink model
      coalesce(study.`biolink:author`, study.`dcterms:creator`)[0] AS first_author,
      study.`gwas:journal`[0] AS journal,
      coalesce(study.`dcterms:Date_Modified`, study.`dcterms:modified`)[0] AS publication_date,
      replace(study.`gwas:pubmedid`[0], "pubmed:", "") AS pubmed_id,
      study.`gwas:initial_sample_size`[0] AS initial_sample_size,
      study.`gwas:replication_sample_size`[0] AS replication_sample_size,
      study.`gwas:association_count`[0] AS association_count,
      study.`gwas:full_summary_statistics`[0] AS full_summary_statistics,
      study.`gwas:genotyping_technology`[0] AS genotyping_technology
cypher_count_fragment: |-
  WITH DISTINCT cl_term, trait, study
  RETURN count(*) AS count
params:
  - param_id: cell_type_id
    param_name: Cell Type
    param_type: SourceId
    values_under: 'cl:0000000'
result_columns:
  - column_id: cell_type
    column_type: GraphNodeId
    facet: true
  - column_id: trait
    column_type: GraphNodeId
    facet: true
  - column_id: study
    column_type: GraphNodeId
  - column_id: study_accession
    column_type: string
  - column_id: reported_trait
    column_type: string
  - column_id: first_author
    column_type: string
  - column_id: journal
    column_type: string
  - column_id: publication_date
    column_type: string
  - column_id: pubmed_id
    column_type: string
  - column_id: initial_sample_size
    column_type: string
  - column_id: replication_sample_size
    column_type: string
    optional: true
  - column_id: association_count
    column_type: string
  - column_id: full_summary_statistics
    column_type: string
  - column_id: genotyping_technology
    column_type: string
materialise:
  mode: full
examples:
  - title: leukocyte
    params:
      cell_type_id: cl:0000738
  - title: blood cell
    params:
      cell_type_id: cl:0000081
  - title: platelet
    params:
      cell_type_id: cl:0000233
