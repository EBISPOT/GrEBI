title: Search GWAS reported different from mapped
question: Which [GWAS reported traits]{reported_trait} mapped to {trait_id} differ from its name?
graphs:
  - ebi_monarch_xspecies
topics:
  - gwas_catalog
  - qc
# QC query: associations mapped to exactly the given term whose reported trait
# is not that term's name or a synonym, i.e. candidates for a mapping that is
# too broad or wrong. Descendants of the term are deliberately not included:
# an association mapped to a child term is annotated at its own level, and
# reporting it here just because its free text differs from the child's name
# was noise (issue #37).
cypher_match_fragment: |-
  MATCH (trait)-[:sourceId]->(:Id { id: $trait_id })
  MATCH (snp:`gwas:SNP`)-[assoc:`gwas:associated_with`]->(trait)
  UNWIND assoc.`gwas:disease_trait` AS reported_trait
  With trait, reported_trait, [id in assoc.`gwas:study` WHERE id =~ "GCST.*" | id][0] AS study_id, assoc.edge_id AS edge_id
  WHERE NOT reported_trait IN trait.`grebi:name` AND NOT reported_trait IN trait.`grebi:synonym`
cypher_return_fragment: |-
  MATCH (study:`gwas:Study`)-[:sourceId]->(:Id { id: study_id })
  RETURN DISTINCT
      reported_trait,
      trait { .id, .`grebi:nodeId`, .`grebi:name`,`grebi:type`: labels(trait) } AS trait,
      study_id AS study_accession,
      replace(study.`gwas:pubmedid`[0], "pubmed:", "") AS pubmed_id,
      edge_id
cypher_count_fragment: |-
  WITH DISTINCT reported_trait, trait, edge_id
  RETURN count(*) AS count
params:
  - param_id: trait_id
    param_name: Term
    param_type: SourceId
result_columns:
  - column_id: reported_trait
    column_type: string
  - column_id: trait
    column_type: GraphNodeId
    facet: true
  - column_id: study_accession
    column_type: string
  - column_id: pubmed_id
    column_type: PubmedId
  - column_id: edge_id
    column_type: EdgeId
examples:
  - title: asthma
    params:
      trait_id: efo:0000270
  - title: response to xenobiotic stimulus
    params:
      trait_id: go:0009410
  - title: blood metabolite level
    params:
      trait_id: oba:2050078
materialise:
  mode: full
