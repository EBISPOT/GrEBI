title: Search GWAS Catalog by disease location
question: What [diseases]{disease} have GWAS associations located in {location_id}?
graphs:
  - ebi_monarch_xspecies
  - impc_x_gwas
topics:
  - gwas_catalog
  - uberon
cypher_match_fragment: |-
  // base-keyed / param-as-closure-root form: location is the base the row is
  // filtered on; the queried location (location_root) is reached via the
  // precomputed broad_match closure, so location is the queried location or a
  // part of it. The row itself is about the associated disease.
  MATCH (location)-[:`biolink:broad_match`*0..1]->(location_root)-[:sourceId]->(:Id {id: $location_id })
  MATCH (matched_disease)-[:`biolink:disease_has_location`]->(location)
  // include subclasses of the matched disease
  MATCH (disease)-[:`biolink:broad_match`*0..1]->(matched_disease)
  MATCH (snp:`gwas:SNP`)-[assoc:`gwas:associated_with`]->(disease)
  OPTIONAL MATCH (gene)<-[:(`gwas:mapped_gene`|`gwas:snp_gene_ids`|`gwas:upstream_gene_id`|`gwas:downstream_gene_id`)]-(snp)
  WITH
    location,
    disease,
    snp,
    gene,
    [id in assoc.`gwas:study` WHERE id =~ "GCST.*" | id][0] AS study_id,
      assoc.`gwas:strongest_snp_risk_allele`[0] AS effect_allele,
      assoc.`gwas:p_value`[0] AS p_value,
      assoc.`gwas:or_or_beta`[0] AS or_or_beta,
      assoc.edge_id AS edge_id
  MATCH (study:`gwas:Study`)-[:sourceId]->(:Id { id: study_id })
cypher_return_fragment: |-
  RETURN DISTINCT
    location { .id, .`grebi:nodeId`, .`grebi:name`,`grebi:type`: labels(location) } AS location,
    disease { .id, .`grebi:nodeId`, .`grebi:name`,`grebi:type`: labels(disease) } AS disease,
    snp { .id, .`grebi:nodeId`, .`grebi:name`,`grebi:type`: labels(snp) } AS snp,
    effect_allele,
    gene { .id, .`grebi:nodeId`, .`grebi:name`,`grebi:type`: labels(gene) } AS gene,
    study_id AS study_accession,
    study.`gwas:pubmedid`[0] AS pubmed_id,
    p_value,
    or_or_beta,
    edge_id
cypher_count_fragment: |-
  WITH DISTINCT location, disease, snp, gene, study, or_or_beta, edge_id
  RETURN count(*) AS count
params:
  - param_id: location_id
    param_name: Anatomical Location
    param_type: SourceId
    param_opts:
      'biolink:broad_match': 'uberon:0001062'
result_columns:
  - column_id: location
    column_type: GraphNodeId
  - column_id: disease
    column_type: GraphNodeId
  - column_id: snp
    column_type: GraphNodeId
  - column_id: effect_allele
    column_type: string
  - column_id: gene
    column_type: GraphNodeId
    optional: true
  - column_id: study_accession
    column_type: string
  - column_id: p_value
    column_type: string
  - column_id: pubmed_id
    column_type: string
  - column_id: or_or_beta
    column_type: float
    optional: true
  - column_id: edge_id
    column_type: EdgeId
materialise:
  mode: full
  params:
    - param_id: location_id
      filters_column: location
      closure: descendants
      domain_kind: id
      domain_root: 'uberon:0001062'
examples:
  - title: lung
    params:
      location_id: uberon:0002048
  - title: liver
    params:
      location_id: uberon:0002107
  - title: retina
    params:
      location_id: uberon:0000966
