title: Search GWAS Catalog by drugs or drug classes indicated for a disease
question: What [GWAS study traits]{trait} are associated with [drugs or drug classes]{drug} used to treat {disease_id}?
graphs:
  - ebi_monarch_xspecies
topics:
  - gwas_catalog
  - chebi
cypher_match_fragment: |-
  MATCH (disease)-[:sourceId]->(:Id {id: $disease_id })
  MATCH (treatment_drug)-[:(
        `biolink:treats` |
        `biolink:applied_to_treat` |
        `biolink:treats_or_applied_or_studied_to_treat` |
        `primekg:indication`
      )]->(disease)
  WITH DISTINCT treatment_drug
  CALL {
      WITH treatment_drug
      RETURN treatment_drug AS trait_input, treatment_drug AS drug
      UNION
      WITH treatment_drug
      MATCH (treatment_drug)-[:`mesh.vocab:pharmacologicalAction`]->(role_input)
      RETURN DISTINCT role_input AS trait_input, role_input AS drug
      UNION
      WITH treatment_drug
      MATCH (treatment_drug)-[:`mesh.vocab:pharmacologicalAction`]->(role)
      WITH DISTINCT
          role,
          [role_id IN role.id WHERE role_id =~ "chebi:[0-9]+" | role_id][0] AS chebi_role_id
      WHERE chebi_role_id IS NOT NULL
      MATCH (goche_role)-[:sourceId]->(:Id { id: replace(chebi_role_id, "chebi:", "goche:") })
      RETURN DISTINCT goche_role AS trait_input, role AS drug
  }
  MATCH (matched_trait)-[:`ro:has_primary_input`]->(trait_input)
  MATCH (trait)-[:(`biolink:subclass_of`|`biolink:broad_match`)*0..1]->(matched_trait)
  MATCH (snp:`gwas:SNP`)-[assoc:`gwas:associated_with`]->(trait)
  OPTIONAL MATCH (gene)<-[:(`gwas:mapped_gene`|`gwas:snp_gene_ids`|`gwas:upstream_gene_id`|`gwas:downstream_gene_id`)]-(snp)
  WITH
      trait,
      drug,
      snp,
      gene,
      [id in assoc.`gwas:study` WHERE id =~ "GCST.*" | id][0] AS study_id,
      assoc.`gwas:strongest_snp_risk_allele`[0] AS effect_allele,
      assoc.`gwas:p_value`[0] AS p_value,
      assoc.`gwas:or_or_beta`[0] AS or_or_beta,
      assoc.edge_id AS edge_id
  MATCH
      (study:`gwas:Study`)-[:sourceId]->(:Id { id: study_id })
cypher_return_fragment: |-
  RETURN DISTINCT
      trait { .id, .`grebi:nodeId`, .`grebi:name`,`grebi:type`: labels(trait) } AS trait,
      drug { .id, .`grebi:nodeId`, .`grebi:name`,`grebi:type`: labels(drug) } AS drug,
      snp { .id, .`grebi:nodeId`, .`grebi:name`,`grebi:type`: labels(snp) } AS snp,
      effect_allele,
      gene { .id, .`grebi:nodeId`, .`grebi:name`,`grebi:type`: labels(gene) } AS gene,
      study_id AS study_accession,
      study.`gwas:pubmedid`[0] AS pubmed_id,
      p_value,
      or_or_beta,
      edge_id
cypher_count_fragment: |-
  WITH DISTINCT trait, drug, snp, gene, study, or_or_beta, edge_id
  RETURN count(*) AS count
params:
  - param_id: disease_id
    param_name: Disease
    param_type: SourceId
    values_under: 'mondo:0000001'
result_columns:
  - column_id: trait
    column_type: GraphNodeId
  - column_id: drug
    column_type: GraphNodeId
  - column_id: snp
    column_type: GraphNodeId
  - column_id: effect_allele
    column_type: string
  - column_id: gene
    column_type: GraphNodeId
    optional: true
  - column_id: study_accession
    column_type: string
  - column_id: p_value
    column_type: string
  - column_id: pubmed_id
    column_type: string
  - column_id: or_or_beta
    column_type: float
    optional: true
  - column_id: edge_id
    column_type: EdgeId
examples:
  - title: stroke
    params:
      disease_id: efo:0000712
  - title: asthma
    params:
      disease_id: mondo:0004979
  - title: major depressive disorder
    params:
      disease_id: mondo:0002009
  - title: lung cancer
    params:
      disease_id: mondo:0008903
