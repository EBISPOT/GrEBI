title: Human GWAS variants to mouse models in IMPC
description: Connects human GWAS variants to mouse models in IMPC using multiple different graph paths through phenotype and disease ontologies
materialise:
  run_for_subgraphs:
    - impc_x_gwas
  uses_datasources:
    - IMPC
    - GWAS
    - Ontologies.mp
    - Ontologies.hp
    - Ontologies.upheno
    - Ontologies.efo
    - Ontologies.mondo
    - Ontologies.doid
    - Ontologies.oba
  cypher: |-
    ////
    //// gwas->oba->upheno->mp->impc
    ////
    MATCH (snp:`gwas:SNP`)-[:`gwas:associated_with`]->(trait)
    MATCH (humanGene)<-[:(`gwas:mapped_gene`|`gwas:snp_gene_ids`|`gwas:upstream_gene_id`|`gwas:downstream_gene_id`)]-(snp)
    MATCH (trait)-[:`biolink:broad_match` *0..1]->(trait_or_ancestor)<-[:`upheno:phenotypeToTrait`]-(speciesNeutralPhenotype)
    MATCH (speciesNeutralPhenotype)<-[:`biolink:broad_match`]-(descendantPhenotype)-[:sourceId]->(descendantSourceId)
    WHERE "Ontologies.mp" IN descendantPhenotype.`grebi:datasources`
    MATCH (descendantPhenotype)<-[:`impc:phenotype`]-(mouseGene)
    MATCH (mouseGene)-[:`impc:humanGeneOrthologues`]->(humanGene)<-[`gwas:snp_gene_ids`]-(snp)
    RETURN DISTINCT
      "gwas->oba->upheno->mp->impc" AS graph_path,
      [id in snp.id WHERE id =~ "rs[0-9]*" | id][0] AS gwas_variant,
      humanGene.`grebi:name`[0] AS human_gene_name,
      [id in humanGene.id WHERE id =~ "hgnc:[0-9]*" | id][0] AS human_gene_id,
      NULL as disease_id,
      NULL as disease_name,
    [id in trait.id WHERE id =~ "oba:.*" | id][0] AS trait_id,
    trait.`grebi:name`[0] as trait_name,
    trait.ic as trait_ic,
    [id in speciesNeutralPhenotype.id WHERE id =~ "upheno:[0-9]*" | id][0] AS species_neutral_phenotype_id,
    speciesNeutralPhenotype.`grebi:name`[0] AS species_neutral_phenotype_name,
    speciesNeutralPhenotype.ic AS species_neutral_phenotype_ic,
    NULL as human_phenotype_id,
    NULL as human_phenotype_name,
    NULL as human_phenotype_ic,
    [id in descendantPhenotype.id WHERE id =~ "mp:[0-9]*" | id][0] AS mouse_phenotype_id,
    descendantPhenotype.`grebi:name`[0] AS mouse_phenotype_name,
    descendantPhenotype.ic AS mouse_phenotype_ic,
    mouseGene.`grebi:name`[0] AS mouse_gene_name,
    [id in mouseGene.id WHERE id =~ "mgi:[0-9]*" | id][0] AS mouse_gene_id
    UNION
    ////
    //// gwas->hp->mp->impc
    ////
    MATCH (snp:`gwas:SNP`)-[:`gwas:associated_with`]->(humanPhenotype)
    MATCH (humanGene)<-[:(`gwas:mapped_gene`|`gwas:snp_gene_ids`|`gwas:upstream_gene_id`|`gwas:downstream_gene_id`)]-(snp)
    MATCH (humanPhenotype)-[:`semapv:crossSpeciesExactMatch`]-(mousePhenotype)
    WHERE "Ontologies.mp" IN mousePhenotype.`grebi:datasources`
    MATCH (mousePhenotype)<-[:`impc:phenotype`]-(mouseGene)
    MATCH (mouseGene)-[:`impc:humanGeneOrthologues`]->(humanGene)<-[`gwas:snp_gene_ids`]-(snp)
    RETURN DISTINCT "gwas->hp->mp->impc" AS graph_path,
    [id in snp.id WHERE id =~ "rs[0-9]*" | id][0] AS gwas_variant,
    humanGene.`grebi:name`[0] AS human_gene_name,
    [id in humanGene.id WHERE id =~ "hgnc:[0-9]*" | id][0] AS human_gene_id,
    NULL as disease_id,
    NULL as disease_name,
    NULL AS trait_id,
    NULL AS trait_name,
    NULL AS trait_ic,
    NULL AS species_neutral_phenotype_id,
    NULL AS species_neutral_phenotype_name,
    NULL AS species_neutral_phenotype_ic,
    [id in humanPhenotype.id WHERE id =~ "hp:[0-9]*" | id][0] AS human_phenotype_id,
    humanPhenotype.`grebi:name`[0] AS human_phenotype_name,
    humanPhenotype.ic as human_phenotype_ic,
    [id in mousePhenotype.id WHERE id =~ "mp:[0-9]*" | id][0] AS mouse_phenotype_id,
    mousePhenotype.`grebi:name`[0] AS mouse_phenotype_name,
    mousePhenotype.ic AS mouse_phenotype_ic,
    mouseGene.`grebi:name`[0] AS mouse_gene_name,
    [id in mouseGene.id WHERE id =~ "mgi:[0-9]*" | id][0] AS mouse_gene_id
    UNION
    ////
    //// gwas->oba->hp->mp->impc
    ////
    MATCH (snp:`gwas:SNP`)-[:`gwas:associated_with`]->(trait)
    MATCH (humanGene)<-[:(`gwas:mapped_gene`|`gwas:snp_gene_ids`|`gwas:upstream_gene_id`|`gwas:downstream_gene_id`)]-(snp)
    MATCH (trait)-[:`biolink:broad_match` *0..1]->(trait_or_ancestor)<-[:`upheno:phenotypeToTrait`]-(humanPhenotype)
    MATCH (humanPhenotype)-[:`semapv:crossSpeciesExactMatch`]-(mousePhenotype)
    WHERE "Ontologies.mp" IN mousePhenotype.`grebi:datasources` AND "Ontologies.hp" IN humanPhenotype.`grebi:datasources`
    MATCH (mousePhenotype)<-[:`impc:phenotype`]-(mouseGene)
    MATCH (mouseGene)-[:`impc:humanGeneOrthologues`]->(humanGene)<-[`gwas:snp_gene_ids`]-(snp)
      RETURN DISTINCT "gwas->oba->hp->mp->impc" AS graph_path,
      [id in snp.id WHERE id =~ "rs[0-9]*" | id][0] AS gwas_variant,
      humanGene.`grebi:name`[0] AS human_gene_name,
      [id in humanGene.id WHERE id =~ "hgnc:[0-9]*" | id][0] AS human_gene_id,
      NULL as disease_id,
      NULL as disease_name,
      [id in trait.id WHERE id =~ "oba:.*" | id][0] AS trait_id,
      trait.`grebi:name`[0] as trait_name,
      trait.ic as trait_ic,
      NULL as species_neutral_phenotype_id,
      NULL as species_neutral_phenotype_name,
      NULL as species_neutral_phenotype_ic,
      [id in humanPhenotype.id WHERE id =~ "hp:[0-9]*" | id][0] AS human_phenotype_id,
      humanPhenotype.`grebi:name`[0] AS human_phenotype_name,
      humanPhenotype.ic as human_phenotype_ic,
      [id in mousePhenotype.id WHERE id =~ "mp:[0-9]*" | id][0] AS mouse_phenotype_id,
      mousePhenotype.`grebi:name`[0] AS mouse_phenotype_name,
      mousePhenotype.ic AS mouse_phenotype_ic,
      mouseGene.`grebi:name`[0] AS mouse_gene_name,
      [id in mouseGene.id WHERE id =~ "mgi:[0-9]*" | id][0] AS mouse_gene_id
    UNION
    ////
    //// gwas->{mondo,doid,efo}->hp->mp->impc
    ////
    MATCH (snp:`gwas:SNP`)-[:`gwas:associated_with`]->(disease)
    MATCH (humanGene)<-[:(`gwas:mapped_gene`|`gwas:snp_gene_ids`|`gwas:upstream_gene_id`|`gwas:downstream_gene_id`)]-(snp)
    MATCH (humanPhenotype)<-[:(`biolink:has_phenotype`|`ro:disease_has_feature`)]-(disease)
    MATCH (humanPhenotype)-[:`semapv:crossSpeciesExactMatch`]-(mousePhenotype)
    WHERE "Ontologies.mp" IN mousePhenotype.`grebi:datasources`
    MATCH (mousePhenotype)<-[:`impc:phenotype`]-(mouseGene)
    MATCH (mouseGene)-[:`impc:humanGeneOrthologues`]->(humanGene)<-[`gwas:snp_gene_ids`]-(snp)
        RETURN DISTINCT "gwas->{mondo,doid,efo}->hp->mp->impc" AS graph_path,
        [id in snp.id WHERE id =~ "rs[0-9]*" | id][0] AS gwas_variant,
        humanGene.`grebi:name`[0] AS human_gene_name,
        [id in humanGene.id WHERE id =~ "hgnc:[0-9]*" | id][0] AS human_gene_id,
        [id in disease.id WHERE id =~ "mondo:.*" | id][0] AS disease_id,
        disease.`grebi:name`[0] as disease_name,
        NULL as trait_id,
        NULL as trait_name,
        NULL as trait_ic,
        NULL as species_neutral_phenotype_id,
        NULL as species_neutral_phenotype_name,
        NULL as species_neutral_phenotype_ic,
        [id in humanPhenotype.id WHERE id =~ "hp:[0-9]*" | id][0] AS human_phenotype_id,
        humanPhenotype.`grebi:name`[0] AS human_phenotype_name,
        humanPhenotype.ic as human_phenotype_ic,
        [id in mousePhenotype.id WHERE id =~ "mp:[0-9]*" | id][0] AS mouse_phenotype_id,
        mousePhenotype.`grebi:name`[0] AS mouse_phenotype_name,
        mousePhenotype.ic AS mouse_phenotype_ic,
        mouseGene.`grebi:name`[0] AS mouse_gene_name,
        [id in mouseGene.id WHERE id =~ "mgi:[0-9]*" | id][0] AS mouse_gene_id
