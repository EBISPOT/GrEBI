title: Environmental risk factors for a disease
question: What [environmental risk factors]{exposure} contribute to {disease_id}?
graphs:
  - ebi_monarch_xspecies
  - dismech
topics:
  - dismech
cypher_match_fragment: |-
  MATCH (disease)-[:sourceId]->(:Id {id: $disease_id})
  MATCH (exposure)-[r:`biolink:contributes_to`]->(disease)
cypher_return_fragment: |-
  RETURN DISTINCT
      disease { .id, .`grebi:nodeId`, .`grebi:name`, `grebi:type`: labels(disease) } AS disease,
      exposure { .id, .`grebi:nodeId`, .`grebi:name`, `grebi:type`: labels(exposure) } AS exposure,
      r.`grebi:datasources` AS from_datasources,
      r.edge_id AS edge_id
cypher_count_fragment: |-
  WITH DISTINCT disease, exposure
  RETURN count(*) AS count
params:
  - param_id: disease_id
    param_name: Disease
    param_type: SourceId
    param_opts:
      'biolink:broad_match': 'mondo:0000001'
result_columns:
  - column_id: disease
    column_type: GraphNodeId
  - column_id: exposure
    column_type: GraphNodeId
  - column_id: from_datasources
    column_type: DatasourceList
  - column_id: edge_id
    column_type: EdgeId
examples:
  - title: asthma
    params:
      disease_id: mondo:0004979
  - title: vitiligo
    params:
      disease_id: mondo:0008661
  - title: hepatocellular carcinoma
    params:
      disease_id: mondo:0007256
materialise:
  mode: full
  params:
    - param_id: disease_id
      filters_column: disease
      closure: exact
      domain_kind: id
      domain_root: 'mondo:0000001'
