title: Search for gene disease associations
question: What [genes]{gene} are associated with {disease_id}?
graphs:
  - ebi_monarch_xspecies
topics:
  - gwas_catalog
cypher_match_fragment: |-
  MATCH (disease)-[:sourceId]->(:Id {id: $disease_id})
  WHERE 'Ontologies.mondo' IN disease.`grebi:datasources`

  // find subclasses
  MATCH (disease)<-[:`biolink:broad_match`*0..1]-(specific_disease)
  WITH DISTINCT specific_disease

  // Gather genes from three sources via a UNION subquery. This streams rows
  // directly instead of materialising large collect()'d lists-of-maps on the
  // heap and re-expanding them with UNWIND, which made this query an order of
  // magnitude slower (e.g. Crohn disease: ~90s -> ~1.5s).
  CALL {
    // branch 1: gene <- specific_disease
    WITH specific_disease
    MATCH (specific_disease)<-[r:(
      `biolink:gene_to_disease_association`|
      `ncit:Gene_Associated_With_Disease`|
      `biolink:has_phenotype`
      )]-(gene:`biolink:GeneOrGeneProduct`)
    RETURN gene, r
  UNION ALL
    // branch 2: specific_disease -> gene
    WITH specific_disease
    MATCH (specific_disease)-[r:`ncit:Disease_Mapped_To_Gene`]->(gene)
    RETURN gene, r
  UNION ALL
    // branch 3: GWAS associations with variants mapped to the gene
    WITH specific_disease
    MATCH (snp:`gwas:SNP`)-[r:`gwas:associated_with`]->(specific_disease)
    MATCH (gene)<-[:(
      `gwas:mapped_gene`|
      `gwas:snp_gene_ids`|
      `gwas:upstream_gene_id`|
      `gwas:downstream_gene_id`
    )]-(snp)
    RETURN gene, r
  }
  WITH specific_disease, gene, r
  WHERE NONE(x IN r.`grebi:datasources` WHERE x = 'CTD')
cypher_return_fragment: |-
  RETURN DISTINCT
      specific_disease { .id, .`grebi:nodeId`, .`grebi:name`,`grebi:type`: labels(specific_disease) } AS disease,
      gene { .id, .`grebi:nodeId`, .`grebi:name`,`grebi:type`: labels(gene) } AS gene,
      r.`grebi:datasources` AS from_datasources,
      r.edge_id AS edge_id
cypher_count_fragment: |-
  WITH DISTINCT specific_disease, gene, r.`grebi:datasources` AS from_datasources, properties(r) AS edge_props
  RETURN count(*) AS count
params:
  - param_id: disease_id
    param_name: Disease
    param_type: SourceId
    param_opts:
      'biolink:broad_match': 'mondo:0000001'
result_columns:
  - column_id: disease
    column_type: GraphNodeId
  - column_id: gene
    column_type: GraphNodeId
  - column_id: from_datasources
    column_type: DatasourceList
  - column_id: edge_id
    column_type: EdgeId
examples:
  - title: Crohn disease
    params: 
      disease_id: mondo:0005011
  - title: bronchiectasis
    params:
      disease_id: mondo:0004822 
  - title: thrombotic microangiopathy
    params:
      disease_id: mondo:0019737
