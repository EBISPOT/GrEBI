title: Search for treatments for a disease
question: What [treatments]{treatment} exist for {disease_id}?
graphs:
  - ebi_monarch_xspecies
  - dismech
topics:
  - dismech
cypher_match_fragment: |-
  MATCH (disease)-[:sourceId]->(:Id {id: $disease_id})
  MATCH (treatment)-[r:(
    `biolink:treats_or_applied_or_studied_to_treat`|
    `otar:drug_indication`
  )]->(disease)
cypher_return_fragment: |-
  RETURN DISTINCT
      disease { .id, .`grebi:nodeId`, .`grebi:name`, `grebi:type`: labels(disease) } AS disease,
      treatment { .id, .`grebi:nodeId`, .`grebi:name`, `grebi:type`: labels(treatment) } AS treatment,
      r.`grebi:datasources` AS from_datasources,
      r.`dismech:supporting_text`[0] AS evidence,
      r.edge_id AS edge_id
cypher_count_fragment: |-
  WITH DISTINCT disease, treatment
  RETURN count(*) AS count
params:
  - param_id: disease_id
    param_name: Disease
    param_type: SourceId
    values_under: 'mondo:0000001'
result_columns:
  - column_id: disease
    column_type: GraphNodeId
  - column_id: treatment
    column_type: GraphNodeId
  - column_id: from_datasources
    column_type: DatasourceList
    facet: true
  - column_id: evidence
    column_type: string
    optional: true
  - column_id: edge_id
    column_type: EdgeId
examples:
  - title: Parkinson disease
    params:
      disease_id: mondo:0005180
  - title: Marfan syndrome
    params:
      disease_id: mondo:0007947
  - title: asthma
    params:
      disease_id: mondo:0004979
materialise:
  mode: full
