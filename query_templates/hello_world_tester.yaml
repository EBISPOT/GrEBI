title: Hello world
description: Tester query to see if the pipeline is working
# Deliberately unscoped (no `graphs` / `run_for_subgraphs`) so it runs for EVERY
# subgraph: it is the pipeline health-check and it guarantees every subgraph
# produces at least one materialised-query row (the run_materialised_queries
# process requires a non-empty results glob). Keep it unconstrained.
materialise:
  uses_datasources:
    - IMPC
    - GWAS
  cypher: |-
    RETURN "Hello, World!" AS message
