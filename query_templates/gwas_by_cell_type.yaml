title: Search GWAS Catalog by cell type
description: Given a cell type from CL, find GWAS studies with traits characteristic of this cell type
subgraphs:
  - ebi_monarch_xspecies
topics:
  - gwas_catalog
  - cl
cypher_match_fragment: |-
  MATCH (cl_term)-[:sourceId]->(:Id {id: $cell_type_id })
  MATCH (cl_term)<-[r:(`ro:characteristic_of`|`ro:characteristic_of_part_of`|`iao:is_about`|`biolink:has_participant`|`biolink:disease_has_location`)]-(trait)
  MATCH (snp:`gwas:SNP`)-[assoc:`gwas:associated_with`]->(trait)
  MATCH (gene)<-[:(`gwas:mapped_gene`|`gwas:snp_gene_ids`|`gwas:upstream_gene_id`|`gwas:downstream_gene_id`)]-(snp)
  WITH
      cl_term,
      trait,
      snp,
      gene,
      [id in assoc.`gwas:study` WHERE id =~ "GCST.*" | id][0] AS study_id,
      assoc.`gwas:or_or_beta`[0] AS or_or_beta
  MATCH
      (study:`gwas:Study`)-[:sourceId]->(:Id { id: study_id })
cypher_return_fragment: |-
  RETURN DISTINCT
      cl_term { .id, .`grebi:nodeId`, .`grebi:name`,`grebi:type`: labels(gene) } AS cell_type,
      trait { .id, .`grebi:nodeId`, .`grebi:name`,`grebi:type`: labels(trait) } AS trait,
      snp { .id, .`grebi:nodeId`, .`grebi:name`,`grebi:type`: labels(trait) } AS snp,
      gene { .id, .`grebi:nodeId`, .`grebi:name`,`grebi:type`: labels(trait) } AS gene,
      study.`grebi:name`[0] AS study_name,
      study.`gwas:pubmedid`[0] AS pubmed_id,
      or_or_beta
cypher_count_fragment: |-
  WITH DISTINCT cl_term, trait, snp, gene, study, or_or_beta
  RETURN count(*) AS count
params:
  - param_id: cell_type_id
    param_name: Cell Type
    param_type: SourceId
    param_opts:
      'biolink:broad_match': 'cl:0000000'
result_columns:
  - column_id: cell_type
    column_type: GraphNodeId
  - column_id: trait
    column_type: GraphNodeId
  - column_id: snp
    column_type: GraphNodeId
  - column_id: gene
    column_type: GraphNodeId
  - column_id: study_name
    column_type: string
  - column_id: pubmed_id
    column_type: string
  - column_id: or_or_beta
    column_type: float  
examples:
  - title: leukocyte
    params:
      cell_type_id: cl:0000738
  - title: blood cell
    params:
      cell_type_id: cl:0000081
  - title: platelet
    params:
      cell_type_id: cl:0000233
