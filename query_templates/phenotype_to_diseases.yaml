title: Diseases associated with a phenotype
question: What [diseases]{disease} are associated with {phenotype_id}?
subgraphs:
  - ebi_monarch_xspecies
  - dismech
topics:
  - dismech
  - phenomics
cypher_match_fragment: |-
  MATCH (phenotype)-[:sourceId]->(:Id {id: $phenotype_id})
  MATCH (disease)-[r:`biolink:has_phenotype`]->(phenotype)
cypher_return_fragment: |-
  RETURN DISTINCT
      disease { .id, .`grebi:nodeId`, .`grebi:name`, `grebi:type`: labels(disease) } AS disease,
      phenotype { .id, .`grebi:nodeId`, .`grebi:name`, `grebi:type`: labels(phenotype) } AS phenotype,
      r.`grebi:datasources` AS from_datasources,
      r.`dismech:frequency_qualifier`[0] AS frequency,
      r.`dismech:supporting_text`[0] AS evidence,
      r.edge_id AS edge_id
cypher_count_fragment: |-
  WITH DISTINCT disease, phenotype
  RETURN count(*) AS count
params:
  - param_id: phenotype_id
    param_name: Phenotype
    param_type: SourceId
result_columns:
  - column_id: disease
    column_type: GraphNodeId
  - column_id: phenotype
    column_type: GraphNodeId
  - column_id: from_datasources
    column_type: DatasourceList
  - column_id: frequency
    column_type: string
    optional: true
  - column_id: evidence
    column_type: string
    optional: true
  - column_id: edge_id
    column_type: EdgeId
examples:
  - title: Scoliosis
    params:
      phenotype_id: hp:0002650
  - title: Seizure
    params:
      phenotype_id: hp:0001250
  - title: Hepatomegaly
    params:
      phenotype_id: hp:0002240
