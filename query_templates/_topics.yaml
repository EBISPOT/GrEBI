topics:
  - id: chebi
    name: ChEBI
    type: Resource
    description: Chemical Entities of Biological Interest (ChEBI) is a freely available dictionary of molecular entities focused on "small" chemical compounds.
    url: https://www.ebi.ac.uk/chebi/
  - id: metabolights
    name: MetaboLights
    type: Resource
    description: MetaboLights is a database for Metabolomics experiments and derived information. The database is cross-species, cross-technique and covers metabolite structures and their reference spectra as well as their biological roles, locations and concentrations, and experimental data from metabolic experiments. MetaboLights is the recommended Metabolomics repository for a number of leading journals.
    url: https://www.ebi.ac.uk/metabolights/
  - id: metabolomics
    name: Metabolomics
    type: Domain
  - id: phenomics
    name: Phenomics
    type: Domain
  - id: genetics
    name: Genetics
    type: Domain
  - id: impc
    name: IMPC
    type: Resource
    description: The International Mouse Phenotyping Consortium (IMPC) is an international effort by 21 research institutions to identify the function of every protein-coding gene in the mouse genome.
    url: https://www.mousephenotype.org/
  - id: opentargets
    name: OpenTargets
    type: Resource
    description: OpenTargets is a public-private partnership that aims to provide a systematic and unbiased platform for drug target identification and prioritisation.
    url: https://www.opentargets.org/
  - id: gwas_catalog
    name: GWAS Catalog
    type: Resource
    description: The NHGRI-EBI GWAS Catalog is a curated collection of published genome-wide association studies (GWAS) and their associated variants.
    url: https://www.ebi.ac.uk/gwas/
  - id: uberon
    name: UBERON
    type: Ontology
    description: Uberon is an integrated cross-species anatomy ontology representing a variety of entities classified according to traditional anatomical criteria such as structure, function and developmental lineage.
    url: https://obophenotype.github.io/uberon/
  - id: reactome
    name: Reactome
    type: Resource
    description: Reactome is a free, open-source, curated and peer-reviewed pathway database. Our goal is to provide intuitive bioinformatics tools for the visualization, interpretation and analysis of pathway knowledge to support basic research, genome analysis, modeling, systems biology and education. 
    url: https://reactome.org/
  - id: cl
    name: Cell Ontology
    type: Ontology
    description: The Cell Ontology (CL) is an ontology designed to classify and describe cell types across different organisms. 
    url: https://obofoundry.org/ontology/cl.html
  - id: dismech
    name: DisMech
    type: Resource
    description: The Disorder Mechanisms Knowledge Base (DisMech) is a curated, evidence-backed knowledge base of disease pathophysiology, phenotypes, and treatments linked to authoritative ontologies. Part of the Monarch Initiative.
    url: https://dismech.monarchinitiative.org/
  - id: qc
    name: Quality Control
    type: Domain
    description: QC queries using the KG to identify potential data issues or inconsistencies in ontologies or content.


