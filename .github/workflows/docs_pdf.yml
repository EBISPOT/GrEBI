name: Build Docs PDF

on:
  push:
    branches: [ "dev", "stable" ]
    paths:
      - 'docs/**'
      - 'webapp/generate_docs_pdf.py'
      - 'webapp/test_queries_and_make_docs.py'
      - 'query_templates/**'
      - 'dataload/scripts/download_local.sh'
      - 'dataload/scripts/dataload_local.sh'
      - '.github/workflows/docs_pdf.yml'
  workflow_dispatch: {}

permissions:
  contents: write
  packages: read

# Only the latest commit's docs are worth publishing: a newer push to the same
# branch cancels a run still in progress instead of running beside it.
concurrency:
  group: docs-pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docs-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          docker system prune -af

      - name: Put the scratch on the large partition
        run: |
          # The pipeline's Nextflow work dir and the Postgres data directory it
          # builds live under ./tmp, which sits on the runner's root filesystem
          # (~28 GB free) — too small for the Postgres index build, which fails
          # with "No space left on device". Relocate the scratch onto the much
          # larger /mnt partition (~70 GB). dataload_local.sh readlink-resolves
          # ./tmp and bind-mounts the resolved path into the orchestrator, and
          # local_4g_nextflow.config mounts an out-of-tree NXF_WORK into every
          # nested process container, so the symlink is transparent to the
          # pipeline.
          sudo mkdir -p /mnt/grebi-tmp
          sudo chown "$(id -u):$(id -g)" /mnt/grebi-tmp
          rm -rf tmp
          ln -s /mnt/grebi-tmp tmp

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the combined image built for this commit
        run: |
          # "Build & publish GrEBI images" runs on the same push and tags the
          # combined image with the commit. The docs, query templates and the
          # doc scripts are baked into that image, so only the image of this
          # very commit renders this commit's docs: wait for it rather than
          # building the same thing again here (or pulling a stale :dev).
          image=ghcr.io/ebispot/grebi_combined:${{ github.sha }}
          for i in $(seq 1 90); do
            if docker manifest inspect "$image" > /dev/null 2>&1; then
              break
            fi
            if [ "$i" = 90 ]; then
              echo "ERROR: $image was not published within 45 minutes; did 'Build & publish GrEBI images' fail?"
              exit 1
            fi
            echo "Waiting for $image to be published ($i)..."
            sleep 30
          done
          docker pull "$image"
          # the name the dataload scripts and the Nextflow configs run
          docker tag "$image" ghcr.io/ebispot/grebi_combined:dev

      # The dismech datasources change rarely and take half an hour to fetch:
      # keep them between runs, keyed on everything that decides what is
      # fetched. Bump the v1 to fetch afresh.
      - name: Restore the dismech download
        id: downloads
        uses: actions/cache@v4
        with:
          path: downloads/dismech
          key: docs-dismech-download-v1-${{ hashFiles('configs/**', 'dataload/nextflow/download.nf', 'dataload/nextflow/download_local.config') }}

      - name: Download dismech data
        if: steps.downloads.outputs.cache-hit != 'true'
        run: |
          export GREBI_SUBGRAPHS=dismech
          export GREBI_NF_DOWNLOAD_CONFIG=dataload/nextflow/download_local.config
          bash dataload/scripts/download_local.sh
          du -sh downloads/dismech

      - name: Run pipeline with docs generation
        run: |
          export GREBI_SUBGRAPHS=dismech
          export GREBI_NF_CONFIG=dataload/nextflow/local_4g_nextflow.config
          export GREBI_NF_EXTRA_ARGS="--make_docs true"
          bash dataload/scripts/dataload_local.sh

      - name: Locate PDF
        id: find-pdf
        run: |
          # publishDir is the flat out/ dir (GREBI_OUT_DIR has no per-subgraph
          # component) and Nextflow publishes SYMLINKS by default — so no
          # -type f (it silently excludes them), and resolve to the real file
          # for the upload steps.
          PDF_PATH=$(find out -name 'grebi-docs.pdf' | head -1)
          if [ -z "$PDF_PATH" ]; then
            echo "ERROR: grebi-docs.pdf not found in output"
            find out -maxdepth 2 | sort || true
            exit 1
          fi
          PDF_PATH=$(readlink -f "$PDF_PATH")
          echo "pdf_path=$PDF_PATH" >> "$GITHUB_OUTPUT"
          echo "Found PDF: $PDF_PATH"

      - name: Upload PDF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: grebi-docs
          path: ${{ steps.find-pdf.outputs.pdf_path }}

      - name: Upload PDF to GitHub Release
        if: github.ref == 'refs/heads/stable' || github.ref == 'refs/heads/dev'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: docs-${{ github.sha }}
          # NB: plain string — GitHub Actions does not shell-substitute $(date)
          name: "Documentation (${{ github.sha }})"
          files: ${{ steps.find-pdf.outputs.pdf_path }}
          draft: false
          prerelease: ${{ github.ref != 'refs/heads/stable' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
