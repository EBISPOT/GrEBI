name: Build Docs PDF

on:
  push:
    branches: [ "dev", "stable" ]
    paths:
      - 'docs/**'
      - 'webapp/generate_docs_pdf.py'
      - 'webapp/test_queries_and_make_docs.py'
      - 'query_templates/**'
      - '.github/workflows/docs_pdf.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-docs-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          docker system prune -af

      - name: Build combined image
        run: docker build -t ghcr.io/ebispot/grebi_combined:dev .

      - name: Download dismech data
        run: |
          export GREBI_SUBGRAPHS=dismech
          export GREBI_NF_DOWNLOAD_CONFIG=dataload/nextflow/download_local.config
          bash dataload/scripts/download_local.sh

      - name: Run pipeline with docs generation
        run: |
          # The pipeline's Nextflow work dir and the Postgres data directory it
          # builds live under ./tmp, which sits on the runner's root filesystem
          # (~28 GB free) — too small for the Postgres index build, which fails
          # with "No space left on device". Relocate the scratch onto the much
          # larger /mnt partition (~70 GB). dataload_local.sh readlink-resolves
          # ./tmp and bind-mounts the resolved path into the orchestrator, and
          # local_4g_nextflow.config mounts an out-of-tree NXF_WORK into every
          # nested process container, so the symlink is transparent to the
          # pipeline.
          sudo mkdir -p /mnt/grebi-tmp
          sudo chown "$(id -u):$(id -g)" /mnt/grebi-tmp
          rm -rf tmp
          ln -s /mnt/grebi-tmp tmp
          export GREBI_SUBGRAPHS=dismech
          export GREBI_NF_CONFIG=dataload/nextflow/local_4g_nextflow.config
          export GREBI_NF_EXTRA_ARGS="--make_docs true"
          bash dataload/scripts/dataload_local.sh

      - name: Locate PDF
        id: find-pdf
        run: |
          # publishDir is the flat out/ dir (GREBI_OUT_DIR has no per-subgraph
          # component), so search the whole tree rather than out/<subgraph>.
          PDF_PATH=$(find out -name 'grebi-docs.pdf' -type f | head -1)
          if [ -z "$PDF_PATH" ]; then
            echo "ERROR: grebi-docs.pdf not found in output; diagnostics follow"
            echo "--- out/ tree (2 levels):"; find out -maxdepth 2 | sort || true
            echo "--- pdfs anywhere under the scratch:"
            find /mnt/grebi-tmp -name '*.pdf' -type f 2>/dev/null | head || true
            echo "--- publish-related nextflow log lines:"
            grep -i publish .nextflow.log | tail -20 || true
            exit 1
          fi
          echo "pdf_path=$PDF_PATH" >> "$GITHUB_OUTPUT"
          echo "Found PDF: $PDF_PATH"

      - name: Upload PDF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: grebi-docs
          path: ${{ steps.find-pdf.outputs.pdf_path }}

      - name: Upload PDF to GitHub Release
        if: github.ref == 'refs/heads/stable' || github.ref == 'refs/heads/dev'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: docs-${{ github.sha }}
          name: "Documentation ($(date -u +%Y-%m-%d))"
          files: ${{ steps.find-pdf.outputs.pdf_path }}
          draft: false
          prerelease: ${{ github.ref != 'refs/heads/stable' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
