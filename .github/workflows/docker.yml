name: Build & publish GrEBI images

on:
  push:
    branches: [ "dev", "stable" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dataload
            image: ghcr.io/ebispot/grebi_dataload
            context: dataload
            file: dataload/Dockerfile
          - name: api
            image: ghcr.io/ebispot/grebi_api
            context: webapp/grebi_api
            file: webapp/grebi_api/Dockerfile
          - name: resolver
            image: ghcr.io/ebispot/grebi_resolver_service
            context: webapp/grebi_resolver_service
            file: webapp/grebi_resolver_service/Dockerfile
          - name: metadata
            image: ghcr.io/ebispot/grebi_metadata_service
            context: webapp/grebi_metadata_service
            file: webapp/grebi_metadata_service/Dockerfile
          - name: prefix
            image: ghcr.io/ebispot/grebi_prefix_service
            context: .
            file: webapp/grebi_prefix_service/Dockerfile
          - name: ui
            image: ghcr.io/ebispot/grebi_ui
            context: webapp/grebi_ui
            file: webapp/grebi_ui/Dockerfile
          - name: combined
            image: ghcr.io/ebispot/grebi_combined
            context: .
            file: webapp/Dockerfile.combined
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.name }} image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ matrix.image }}:${{ github.sha }}
            ${{ matrix.image }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test-hello-world:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Pull the freshly built image
        run: docker pull ghcr.io/ebispot/grebi_dataload:${{ github.sha }}
      
      - name: Test dataload
        run: |
          # Use the commit SHA tag to ensure we test the exact image that was just built
          sed -i "s|:dev|:${{ github.sha }}|g" \
            dataload/nextflow/local_64g_nextflow.config
          GREBI_SUBGRAPH=hello_world ./dataload/scripts/dataload_local.sh
