name: Build grebi_base image

# grebi_base carries the heavy, rarely-changing runtime layers (Debian packages,
# PostgreSQL, Node/Caddy/Docker-CLI, Java, Maven, Neo4j, Nextflow) that the
# combined image builds FROM. Built ON DEMAND, not on a schedule:
#   - manually via the "Run workflow" button (workflow_dispatch), or
#   - automatically when Dockerfile.base (or this workflow) changes.
on:
  workflow_dispatch: {}
  push:
    branches: [ "dev", "stable" ]
    paths:
      - 'Dockerfile.base'
      - '.github/workflows/base.yml'

env:
  REGISTRY: ghcr.io

jobs:
  build-base:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push grebi_base
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.base
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/ebispot/grebi_base:${{ github.ref_name }}
            ghcr.io/ebispot/grebi_base:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
