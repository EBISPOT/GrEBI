name: UI Tests

# Unit tests for grebi_ui (Vitest + Testing Library), a couple of minutes on a
# plain Node runner. The image build in e2e_tests.yml still catches bundle
# breakage, but only ~10 minutes later.

on:
  push:
    branches: [ "dev", "stable" ]
    paths:
      - 'webapp/grebi_ui/**'
      - 'docs/**'
      - '.github/workflows/ui_tests.yml'
  pull_request:
    branches: [ "dev", "stable" ]
    paths:
      - 'webapp/grebi_ui/**'
      - 'docs/**'
      - '.github/workflows/ui_tests.yml'

permissions:
  contents: read

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp/grebi_ui
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webapp/grebi_ui/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests with coverage thresholds
        run: npm run test:coverage

      - name: Build the bundle
        run: npm run build:ebi

      # A process.env read the build left in place throws "process is not
      # defined" in the browser and takes the whole app down; the build must
      # have replaced every one, set or not (comments excepted).
      - name: The bundle reads nothing from process.env at runtime
        run: |
          if grep -v '^ *//' dist/bundle.js | grep -q 'process\.env\.'; then
            grep -n 'process\.env\.' dist/bundle.js | grep -v '^[0-9]*: *//' | head
            exit 1
          fi
